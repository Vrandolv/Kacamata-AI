<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VRANDOLV SMART MIRROR</title>

  <!-- Library Deteksi Wajah (MediaPipe) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1424;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: #10192d;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.5rem;
    }

    .title-box h2 {
      font-size: 1.1rem;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .title-box p {
      font-size: 0.75rem;
      color: #f5a623;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .camera-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000000;
      border: 2px solid #f5a623;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Cermin */
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Kondisi default: Merah putus-putus */
    #face-guide {
      fill: none;
      stroke: #ff3b30;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
      transition: stroke 0.2s ease, filter 0.2s ease, stroke-dasharray 0.2s ease;
    }

    /* Kondisi pas di tengah & ukuran sesuai: Hijau solid + glow */
    #face-guide.valid {
      stroke: #00e676;
      stroke-width: 2.2;
      stroke-dasharray: none;
      filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.9));
    }

    /* Styling Box API Key */
    .api-key-box {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    #api-key-input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1e2c4a;
      background-color: #0b1325;
      color: #fff;
      font-size: 0.85rem;
    }

    #btn-save-key {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background-color: #f5a623;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #btn-save-key:active {
      opacity: 0.8;
    }

    #btn-analisis {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background-color: #00c853;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    #btn-analisis:disabled {
      background-color: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    
    /* Efek visual saat proses berjalan */
    #btn-analisis.loading {
      background-color: #f5a623;
      cursor: progress;
    }

    .disclaimer {
      font-size: 0.65rem;
      color: #8da2c0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">🛡️</div>
      <div class="title-box">
        <h2>VRANDOLV</h2>
        <p>SMART MIRROR</p>
      </div>
    </div>

    <div class="camera-frame">
      <video id="webcam" autoplay playsinline muted></video>
      
      <!-- Oval dilebarkan agar sesuai proporsi asli wajah (rx=32, ry=42) -->
      <svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
        <ellipse id="face-guide" cx="50" cy="50" rx="32" ry="42" />
      </svg>
    </div>

    <!-- Box input API Key -->
    <div class="api-key-box">
      <input type="password" id="api-key-input" value="" placeholder="Masukkan Token OAuth...">
      <button id="btn-save-key">Simpan</button>
    </div>

    <button id="btn-analisis" disabled>Mulai Analisis</button>
    <p class="disclaimer">* Foto tidak disimpan di server atau perangkat manapun.</p>
  </div>

  <script>
    const video = document.getElementById("webcam");
    const faceGuide = document.getElementById("face-guide");
    const btnAnalisis = document.getElementById("btn-analisis");
    const apiKeyInput = document.getElementById("api-key-input");
    const btnSaveKey = document.getElementById("btn-save-key");

    // --- Logika API Key (Pusat Penyimpanan LocalStorage) ---
    const savedApiKey = localStorage.getItem("googleApiKey");
    if (savedApiKey) {
      apiKeyInput.value = savedApiKey;
    }

    btnSaveKey.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem("googleApiKey", key);
        alert("API Key berhasil disimpan dengan aman di memori HP!");
      } else {
        alert("API Key tidak boleh kosong.");
      }
    });

    // --- Kalibrasi Toleransi (Menyesuaikan Oval yang Lebih Besar) ---
    const TARGET_CENTER_X = 0.50; 
    const TARGET_CENTER_Y = 0.50; 
    const MAX_CENTER_OFFSET = 0.12; 
    const MIN_FACE_WIDTH = 0.40;    
    const MAX_FACE_WIDTH = 0.65;    

    function handleResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        setGuideState(false);
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];

      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      for (let i = 0; i < landmarks.length; i++) {
        const currentX = 1 - landmarks[i].x;
        const currentY = landmarks[i].y;

        if (currentX < minX) minX = currentX;
        if (currentX > maxX) maxX = currentX;
        if (currentY < minY) minY = currentY;
        if (currentY > maxY) maxY = currentY;
      }

      const faceCenterX = (minX + maxX) / 2;
      const faceCenterY = (minY + maxY) / 2;
      const faceWidth = maxX - minX;

      const centerDistance = Math.hypot(faceCenterX - TARGET_CENTER_X, faceCenterY - TARGET_CENTER_Y);
      
      const isCentered = centerDistance <= MAX_CENTER_OFFSET;
      const isFullFace = faceWidth >= MIN_FACE_WIDTH && faceWidth <= MAX_FACE_WIDTH;

      if (isCentered && isFullFace) {
        setGuideState(true);
      } else {
        setGuideState(false);
      }
    }

    function setGuideState(isValid) {
      // Tahan hijau jika sedang loading analisis
      if (btnAnalisis.classList.contains("loading")) return;

      if (isValid) {
        faceGuide.classList.add("valid");
        btnAnalisis.removeAttribute("disabled");
      } else {
        faceGuide.classList.remove("valid");
        btnAnalisis.setAttribute("disabled", "true");
      }
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    faceMesh.onResults(handleResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 480,
      height: 640
    });

    camera.start().catch((err) => {
      console.error("Akses kamera ditolak atau gagal:", err);
    });

    // --- Langsung Proses Tanpa Pop-up ---
    btnAnalisis.addEventListener("click", () => {
      const token = localStorage.getItem("googleApiKey");
      if (!token) {
        alert("Harap masukkan dan simpan Token OAuth terlebih dahulu.");
        return;
      }

      // Tombol berubah menjadi mode loading
      btnAnalisis.innerText = "Menganalisis Wajah...";
      btnAnalisis.classList.add("loading");
      btnAnalisis.setAttribute("disabled", "true");
      faceGuide.classList.add("valid");

      // Logika pemrosesan/API ditempatkan di sini
      // ...
    });
  </script>
</body>
</html>
