<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vrandolv Smart Mirror</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #070d17; margin: 0; padding: 10px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 460px; }
    .card { background: #111c2e; border-radius: 20px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #1e293b; text-align: center; }
    
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 12px;
    }
    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }
    h2 {
      margin: 0;
      color: #f1f5f9;
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
      text-align: left;
    }
    h2 span { color: #f59e0b; display: block; font-size: 14px; }
    
    .mirror-box {
      width: 100%;
      height: 50vh;
      min-height: 360px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #f59e0b;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas { display: none; }
    
    .scan-laser {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, #f59e0b, transparent);
      box-shadow: 0 0 14px #38bdf8;
      display: none;
      z-index: 10;
      animation: laserMove 2s ease-in-out infinite alternate;
    }
    @keyframes laserMove {
      0% { top: 4%; }
      100% { top: 94%; }
    }
    
    .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn.locked { background: #334155 !important; color: #94a3b8 !important; cursor: not-allowed !important; pointer-events: none !important; }
    .btn:disabled { background: #334155; color: #94a3b8; }
    
    .privacy-notice { margin-top: 6px; font-size: 11px; color: #64748b; font-style: italic; }
    
    .status-box {
      margin-top: 12px;
      display: none;
      background: #0b1322;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      text-align: center;
    }
    .status-text { font-size: 13px; color: #38bdf8; font-weight: 600; margin-bottom: 8px; }
    .loader-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 4px; overflow: hidden; position: relative; }
    .loader-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b);
      border-radius: 4px;
      position: absolute;
      animation: movingBar 1.5s infinite ease-in-out;
    }
    @keyframes movingBar {
      0% { left: -40%; width: 30%; }
      50% { width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    
    .notice-box {
      margin-top: 10px;
      display: none;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 12px;
      border-radius: 10px;
      font-size: 12.5px;
      color: #fbbf24;
      line-height: 1.5;
    }
    
    .result-container { margin-top: 14px; display: none; text-align: left; }
    .tags-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .tag-badge { flex: 1; background: #0b1322; padding: 10px; border-radius: 10px; border: 1px solid #1e293b; text-align: center; }
    .tag-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
    .tag-value { font-size: 15px; font-weight: bold; color: #f59e0b; margin-top: 2px; }
    
    .section-title { font-size: 13px; font-weight: bold; color: #cbd5e1; margin: 14px 0 8px; text-transform: uppercase; }
    .item-box { background: #0b1322; border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #1e293b; font-size: 13px; line-height: 1.4; }
    .item-box.avoid { border-color: rgba(239, 68, 68, 0.4); }
    .item-title { font-weight: bold; color: #f8fafc; font-size: 14px; margin-bottom: 3px; }
    .item-color { font-size: 12px; color: #38bdf8; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <div class="brand-header">
        <img src="logo.png" alt="Vrandolv Logo" class="brand-logo-img" onerror="this.style.display='none'">
        <h2>VRANDOLV <span>SMART MIRROR</span></h2>
      </div>

      <div class="mirror-box">
        <div id="scanLaser" class="scan-laser"></div>
        <video id="video" autoplay playsinline muted></video>
      </div>
      <canvas id="canvas"></canvas>

      <button id="actionBtn" class="btn" onclick="handleButtonClick()">Mulai Analisis</button>
      
      <div class="privacy-notice">
        * Foto tidak disimpan di server atau perangkat manapun.
      </div>

      <!-- Pesan Peringatan Ramah: Server Penuh -->
      <div id="noticeBox" class="notice-box"></div>

      <!-- Status Animasi Memindai -->
      <div id="statusBox" class="status-box">
        <div id="statusText" class="status-text">Menyesuaikan fokus cermin...</div>
        <div class="loader-bar">
          <div class="loader-fill"></div>
        </div>
      </div>
      
      <!-- Hasil Analisis -->
      <div id="resultContainer" class="result-container">
        <div class="tags-row">
          <div class="tag-badge">
            <div class="tag-title">Bentuk Wajah</div>
            <div id="resFaceShape" class="tag-value">-</div>
          </div>
          <div class="tag-badge">
            <div class="tag-title">Tone Kulit</div>
            <div id="resSkinTone" class="tag-value">-</div>
          </div>
        </div>

        <div class="section-title">✨ Model & Warna Frame yang Cocok</div>
        <div id="matchList"></div>

        <div class="section-title" style="color: #f87171;">🚫 Model yang Perlu Dihindari</div>
        <div id="avoidList"></div>
      </div>

    </div>
  </div>

  <script>
    const _KEY = "Aq1yFXgGwYj41MZDY9lizwrQiD40Aj_pj47zdf7B5YML6NR8bA.QA".split("").reverse().join("");

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const actionBtn = document.getElementById('actionBtn');
    const scanLaser = document.getElementById('scanLaser');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const noticeBox = document.getElementById('noticeBox');
    const resultContainer = document.getElementById('resultContainer');

    let isProcessing = false;
    let isCooldown = false;
    let stepTimer = null;

    window.onload = async function() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 800 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Harap izinkan akses kamera.");
      }
    };

    function handleButtonClick() {
      if (isProcessing || isCooldown) return;
      captureAndAnalyze();
    }

    // Fungsi penguncian 30 detik
    function startCooldownTimer(seconds = 30) {
      isCooldown = true;
      actionBtn.disabled = true;
      actionBtn.classList.add("locked");

      let remaining = seconds;
      actionBtn.innerText = `Coba Lagi dalam ${remaining} detik...`;

      const interval = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          actionBtn.innerText = `Coba Lagi dalam ${remaining} detik...`;
        } else {
          clearInterval(interval);
          isCooldown = false;
          actionBtn.disabled = false;
          actionBtn.classList.remove("locked");
          actionBtn.innerText = "Mulai Analisis Lagi";
          noticeBox.style.display = "none";
        }
      }, 1000);
    }

    async function captureAndAnalyze() {
      isProcessing = true;
      scanLaser.style.display = "block";
      noticeBox.style.display = "none";
      resultContainer.style.display = "none";
      statusBox.style.display = "block";
      
      actionBtn.disabled = true;
      actionBtn.innerText = "Memproses...";

      statusText.innerText = "Menyesuaikan fokus cermin...";
      stepTimer = setTimeout(() => {
        statusText.innerText = "Membaca proporsi & tone wajah...";
      }, 3000);

      canvas.width = 400;
      canvas.height = 533;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.65).split(',')[1];

      const promptText = `Analisis foto wajah ini untuk rekomendasi kacamata optik.
Keluarkan HANYA format JSON valid tanpa tanda kutip markdown persis seperti ini:
{
  "bentuk_wajah": "Bulat",
  "tone_kulit": "Sawo Matang",
  "frame_cocok": [
    {"nama": "Kotak (Square / Rectangular)", "warna": "Tortoise Havana", "alasan": "Sudut tegas menyeimbangkan kebulatan pipi agar tampak lebih proporsional."},
    {"nama": "Wayfarer Klasik", "warna": "Hitam Doff", "alasan": "Memberikan ilusi garis wajah yang lebih tegas."}
  ],
  "frame_hindari": [
    {"nama": "Bulat Kecil (Round)", "warna": "Hitam Mengkilap", "alasan": "Menonjolkan garis pipi sehingga wajah terlihat semakin penuh."}
  ]
}`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(_KEY)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": _KEY
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await response.json();

        if (data.error) {
          throw new Error("Server penuh");
        }

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/gi, "").replace(/```/gi, "").trim();
        const res = JSON.parse(rawText);

        document.getElementById('resFaceShape').innerText = res.bentuk_wajah || "-";
        document.getElementById('resSkinTone').innerText = res.tone_kulit || "-";

        let matchHtml = "";
        (res.frame_cocok || []).forEach(f => {
          matchHtml += `
            <div class="item-box">
              <div class="item-title">${f.nama}</div>
              <div class="item-color">Warna Disarankan: ${f.warna}</div>
              <div>${f.alasan}</div>
            </div>`;
        });
        document.getElementById('matchList').innerHTML = matchHtml;

        let avoidHtml = "";
        (res.frame_hindari || []).forEach(f => {
          avoidHtml += `
            <div class="item-box avoid">
              <div class="item-title" style="color: #fca5a5;">🚫 ${f.nama}</div>
              <div class="item-color" style="color: #fca5a5;">Warna Dihindari: ${f.warna}</div>
              <div>${f.alasan}</div>
            </div>`;
        });
        document.getElementById('avoidList').innerHTML = avoidHtml;

        statusBox.style.display = "none";
        resultContainer.style.display = "block";
        actionBtn.innerText = "Mulai Analisis Lagi";
        actionBtn.disabled = false;

      } catch (err) {
        statusBox.style.display = "none";
        noticeBox.innerText = "Sedang banyak permintaan, server penuh. Mohon mencoba beberapa saat lagi.";
        noticeBox.style.display = "block";
        
        startCooldownTimer(30);
      } finally {
        isProcessing = false;
        clearTimeout(stepTimer);
        scanLaser.style.display = "none";
      }
    }
  </script>
</body>
</html>
