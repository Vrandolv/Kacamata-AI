<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VRANDOLV</title>

  <!-- Library Deteksi Wajah (MediaPipe) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1424;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: #10192d;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #1e2c4a;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: center;
      margin-bottom: 4px;
    }

    .logo-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .title-box h2 {
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      font-weight: 800;
      color: #38bdf8;
    }

    .camera-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000000;
      border: 2px solid #0284c7;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.35);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efek Cermin */
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Kondisi default: Merah putus-putus */
    #face-guide {
      fill: none;
      stroke: #ff3b30;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
      transition: stroke 0.2s ease, filter 0.2s ease, stroke-dasharray 0.2s ease;
    }

    /* Kondisi pas: Hijau solid + glow */
    #face-guide.valid {
      stroke: #10b981;
      stroke-width: 2.2;
      stroke-dasharray: none;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.9));
    }

    #btn-analisis {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background-color: #10b981;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    #btn-analisis:active {
      transform: scale(0.98);
    }

    #btn-analisis:disabled {
      background-color: #334155;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    
    .loading {
      text-align: center;
      font-weight: bold;
      color: #38bdf8;
      font-size: 0.9rem;
      display: none;
    }

    .result-box {
      width: 100%;
      padding: 16px;
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.85rem;
      color: #e2e8f0;
      display: none;
    }

    .disclaimer {
      font-size: 0.65rem;
      color: #64748b;
      text-align: center;
    }

    /* Canvas untuk mengambil foto secara sembunyi-sembunyi */
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="logo.png" alt="Logo" class="logo-img">
      <div class="title-box">
        <h2>VRANDOLV</h2>
      </div>
    </div>

    <div class="camera-frame">
      <video id="webcam" autoplay playsinline muted></video>
      
      <svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
        <!-- Bentuk oval manusiawi -->
        <ellipse id="face-guide" cx="50" cy="50" rx="32" ry="42" />
      </svg>
    </div>
    
    <canvas id="canvas"></canvas>

    <button id="btn-analisis" disabled>Mulai Analisis</button>
    
    <div id="loading" class="loading">⏳ Sedang menganalisis wajah & kecocokan kacamata...</div>
    <div id="result" class="result-box"></div>

    <p class="disclaimer">* Foto tidak disimpan di server atau perangkat manapun.</p>
  </div>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const faceGuide = document.getElementById("face-guide");
    const btnAnalisis = document.getElementById("btn-analisis");
    const loading = document.getElementById("loading");
    const resultBox = document.getElementById("result");

    // --- 1. Kalibrasi Wajah ---
    const TARGET_CENTER_X = 0.50; 
    const TARGET_CENTER_Y = 0.50; 
    const MAX_CENTER_OFFSET = 0.12; 
    const MIN_FACE_WIDTH = 0.40;    
    const MAX_FACE_WIDTH = 0.65;    

    function handleResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        setGuideState(false);
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      
      for (let i = 0; i < landmarks.length; i++) {
        const currentX = 1 - landmarks[i].x;
        const currentY = landmarks[i].y;
        if (currentX < minX) minX = currentX;
        if (currentX > maxX) maxX = currentX;
        if (currentY < minY) minY = currentY;
        if (currentY > maxY) maxY = currentY;
      }

      const faceCenterX = (minX + maxX) / 2;
      const faceCenterY = (minY + maxY) / 2;
      const faceWidth = maxX - minX;
      const centerDistance = Math.hypot(faceCenterX - TARGET_CENTER_X, faceCenterY - TARGET_CENTER_Y);
      
      const isCentered = centerDistance <= MAX_CENTER_OFFSET;
      const isFullFace = faceWidth >= MIN_FACE_WIDTH && faceWidth <= MAX_FACE_WIDTH;

      if (isCentered && isFullFace) {
        setGuideState(true);
      } else {
        setGuideState(false);
      }
    }

    function setGuideState(isValid) {
      // Abaikan perubahan warna jika sedang loading
      if (btnAnalisis.classList.contains("is-loading")) return;

      if (isValid) {
        faceGuide.classList.add("valid");
        btnAnalisis.removeAttribute("disabled");
      } else {
        faceGuide.classList.remove("valid");
        btnAnalisis.setAttribute("disabled", "true");
      }
    }

    // --- 2. Mulai Kamera & MediaPipe ---
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    faceMesh.onResults(handleResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 480,
      height: 640
    });

    camera.start().catch((err) => {
      alert("Harap izinkan akses kamera di browser.");
    });

    // --- 3. Logika Analisis AI ---
    btnAnalisis.addEventListener("click", async () => {
      // Cari API key dari penyimpanan memori HP
      const apiKey = localStorage.getItem("gemini_api_key") || localStorage.getItem("googleApiKey");
      
      if (!apiKey) {
        alert("Kunci API tidak ditemukan di memori HP. Harap hubungi pengembang.");
        return;
      }

      // Kunci tampilan UI
      btnAnalisis.classList.add("is-loading");
      btnAnalisis.disabled = true;
      faceGuide.classList.add("valid");
      loading.style.display = "block";
      resultBox.style.display = "none";

      // Ambil gambar dari video ke canvas
      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1); // Mirror gambar hasil jepretan agar sesuai layar
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Image = dataUrl.split(',')[1];

      const promptText = `Bertindaklah sebagai konsultan optik profesional dan ahli gaya kacamata dari Vrandolv Eyewear. Analisis wajah pelanggan pada foto ini secara santun, percaya diri, dan berikan poin-poin berikut:

1. **Bentuk Wajah**: Tentukan bentuk wajahnya (Bulat, Kotak, Oval, Hati, Lonjong) dan jelaskan secara singkat proporsi rahangnya.
2. **Skin Tone & Undertone**: Sebutkan warna kulit (Sawo Matang, Kuning Langsat, dsb) serta undertone-nya (Warm/Cool/Neutral).
3. **Model Frame yang Cocok**: Rekomendasikan 2 bentuk kacamata yang paling seimbang untuk bentuk wajah ini.
4. **Warna Frame yang Disarankan**: Berikan pilihan warna bingkai yang membuat warna kulit tampak cerah berseri.
5. **Frame yang Harus Dihindari**: Sebutkan model frame yang sebaiknya dihindari.
6. **Status Kacamata**: Jika pelanggan SUDAH memakai kacamata pada foto ini, beri penilaian jujur: Apakah kacamata tersebut sudah cocok atau belum, dan apa sarannya.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();

        if (data.error) {
          resultBox.innerHTML = `<strong>Pesan Google:</strong> ${data.error.message || JSON.stringify(data.error)}`;
        } else if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          let text = data.candidates[0].content.parts[0].text;
          text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          resultBox.innerHTML = text.replace(/\n/g, "<br>");
        } else {
          resultBox.innerHTML = "Wajah tidak terbaca. Pastikan posisi wajah tepat menghadap cermin.";
        }
      } catch (err) {
        resultBox.innerHTML = "Kesalahan koneksi: " + err.message;
      } finally {
        loading.style.display = "none";
        resultBox.style.display = "block";
        btnAnalisis.classList.remove("is-loading");
        btnAnalisis.disabled = false;
      }
    });
  </script>
</body>
</html>
