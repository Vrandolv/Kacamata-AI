<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Mirror Optik</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; margin: 0; padding: 14px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 16px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h2 { margin: 0 0 12px; color: #38bdf8; text-align: center; font-size: 18px; }
    
    /* Layar Cermin Live Langsung */
    .mirror-box {
      width: 100%;
      height: 380px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 2px solid #38bdf8;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efek Cermin */
    }
    canvas { display: none; }
    
    .btn { display: block; width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 14px; }
    .btn:disabled { background: #475569; color: #94a3b8; }
    
    .result-box { margin-top: 16px; padding: 16px; background: #0f172a; border-left: 4px solid #38bdf8; border-radius: 10px; line-height: 1.6; font-size: 14px; color: #e2e8f0; display: none; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    details { margin-bottom: 12px; font-size: 13px; color: #94a3b8; }
    summary { cursor: pointer; color: #38bdf8; }
    .loading { text-align: center; font-weight: bold; color: #38bdf8; margin-top: 14px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>👓 Smart Mirror Optik</h2>
      
      <!-- Pengaturan Kunci API -->
      <details>
        <summary>⚙️ Kunci API (Klik untuk cek/simpan)</summary>
        <div style="margin-top: 10px;">
          <input type="text" id="apiKeyInput" placeholder="Tempel API Key di sini...">
          <button class="btn" style="background: #0284c7; padding: 10px; font-size: 13px; margin-top: 4px;" onclick="saveApiKey()">Simpan Kunci</button>
        </div>
      </details>

      <!-- Kamera Live -->
      <div class="mirror-box">
        <video id="video" autoplay playsinline muted></video>
      </div>
      <canvas id="canvas"></canvas>

      <button id="analyzeBtn" class="btn" onclick="captureAndAnalyze()">Mulai Analisis</button>
      
      <div id="loading" class="loading">⏳ Sedang menganalisis wajah...</div>
      <div id="result" class="result-box"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('result');

    window.onload = function() {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      }
      startLiveMirror();
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("gemini_api_key", key);
        alert("Kunci API berhasil disimpan!");
      }
    }

    // Menyalakan Kamera Depan Langsung di Layar Web
    async function startLiveMirror() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Harap izinkan akses kamera di Chrome agar cermin live bisa menyala.");
      }
    }

    async function captureAndAnalyze() {
      const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) {
        alert("Harap simpan Kunci API di menu atas terlebih dahulu.");
        return;
      }

      // Ambil frame instan langsung dari video cermin
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Image = dataUrl.split(',')[1];

      loading.style.display = "block";
      analyzeBtn.disabled = true;
      resultBox.style.display = "none";

      const promptText = `Bertindaklah sebagai konsultan optik profesional. Analisis foto wajah ini secara singkat, padat, dan to the point:

1. **Bentuk Wajah**: Sebutkan bentuk wajah (Bulat, Kotak, Oval, Lonjong, dsb) beserta ciri utamanya.
2. **Rekomendasi Frame Kacamata**: Rekomendasikan 2 model bingkai kacamata yang paling cocok dan alasan penyeimbangnya.
3. **Model yang Harus Dihindari**: Sebutkan jenis frame yang sebaiknya tidak dipilih.
4. **Status Kacamata**: Jika orang dalam foto SUDAH memakai kacamata, sebutkan apakah kacamata tersebut sudah cocok atau belum beserta sarannya.

Gunakan bahasa Indonesia yang jelas, ramah, dan profesional.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }]
          })
        });

        const data = await response.json();

        if (data.error) {
          resultBox.innerHTML = `<strong>Pesan Google:</strong> ${data.error.message || JSON.stringify(data.error)}`;
          resultBox.style.display = "block";
          return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          let text = data.candidates[0].content.parts[0].text;
          text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          resultBox.innerHTML = text.replace(/\n/g, "<br>");
          resultBox.style.display = "block";
        } else {
          resultBox.innerHTML = "Wajah tidak terbaca. Pastikan wajah tepat menghadap cermin.";
          resultBox.style.display = "block";
        }
      } catch (err) {
        resultBox.innerHTML = "Kesalahan koneksi: " + err.message;
        resultBox.style.display = "block";
      } finally {
        loading.style.display = "none";
        analyzeBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
