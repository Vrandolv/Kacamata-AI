<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vrandolv Smart Mirror</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #070d17; margin: 0; padding: 10px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #111c2e; border-radius: 20px; padding: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid #1e293b; text-align: center; }
    
    /* Header Sejajar (Logo di Samping Judul) */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 12px;
    }
    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
    }
    h2 {
      margin: 0;
      color: #f1f5f9;
      font-size: 17px;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
      text-align: left;
      line-height: 1.2;
    }
    h2 span { color: #f59e0b; display: block; font-size: 15px; }
    
    /* Layar Cermin */
    .mirror-box {
      width: 100%;
      height: 54vh;
      min-height: 390px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #f59e0b;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas { display: none; }

    /* Laser Scanner */
    .scan-laser {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, #f59e0b, transparent);
      box-shadow: 0 0 14px #38bdf8;
      display: none;
      z-index: 10;
      animation: laserMove 2s ease-in-out infinite alternate;
    }
    @keyframes laserMove {
      0% { top: 4%; }
      100% { top: 94%; }
    }
    
    .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 12px; transition: 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #334155; color: #94a3b8; box-shadow: none; }
    
    /* Progress Bar */
    .progress-box { margin-top: 12px; display: none; background: #0b1322; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; text-align: left; }
    .progress-status { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 6px; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #f59e0b); border-radius: 6px; transition: width 0.3s ease; }
    
    /* Hasil Visual */
    .result-container { margin-top: 14px; display: none; text-align: left; }
    
    .tags-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .tag-badge { flex: 1; background: #0b1322; padding: 10px; border-radius: 12px; border: 1px solid #1e293b; text-align: center; }
    .tag-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
    .tag-value { font-size: 15px; font-weight: bold; color: #f59e0b; }
    
    /* Fit Checker */
    .fit-checker-card { background: #0b1322; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid #334155; }
    .fit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .fit-title { font-size: 13px; font-weight: bold; color: #cbd5e1; }
    .fit-score { font-size: 14px; font-weight: 800; padding: 3px 10px; border-radius: 20px; }
    .score-high { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .score-med { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .score-low { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .fit-desc { font-size: 12.5px; color: #94a3b8; line-height: 1.5; }
    
    .section-title { font-size: 13px; font-weight: bold; color: #cbd5e1; margin: 12px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .frame-card { display: flex; align-items: center; background: #0b1322; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; border: 1px solid #1e293b; }
    .frame-card.avoid { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.06); }
    
    .frame-icon-wrap { width: 80px; height: 38px; flex-shrink: 0; margin-right: 14px; display: flex; align-items: center; justify-content: center; }
    .frame-icon-wrap svg { width: 100%; height: 100%; }
    
    .frame-info { flex: 1; }
    .frame-name { font-size: 14px; font-weight: bold; color: #f8fafc; }
    .frame-desc { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    
    /* Palet Warna Bulat */
    .colors-grid { display: flex; flex-wrap: wrap; gap: 8px; background: #0b1322; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; }
    .color-chip { display: flex; align-items: center; background: #162238; padding: 6px 12px; border-radius: 20px; font-size: 13px; border: 1px solid #334155; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; margin-right: 8px; border: 1.5px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- Logo di Samping Tulisan (Horizontal) -->
      <div class="brand-header">
        <img src="logo.png" alt="Vrandolv Logo" class="brand-logo-img" onerror="this.style.display='none'">
        <h2>VRANDOLV <span>SMART MIRROR</span></h2>
      </div>

      <!-- Layar Cermin -->
      <div class="mirror-box">
        <div id="scanLaser" class="scan-laser"></div>
        <video id="video" autoplay playsinline muted></video>
      </div>
      <canvas id="canvas"></canvas>

      <button id="analyzeBtn" class="btn" onclick="captureAndAnalyze()">Mulai Analisis</button>
      
      <!-- Progress Bar Dinamis -->
      <div id="progressBox" class="progress-box">
        <div class="progress-status">
          <span id="progressText">⏳ Menghubungkan ke cermin AI...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>
      
      <!-- Hasil Analisis Visual -->
      <div id="resultContainer" class="result-container">
        
        <div class="tags-row">
          <div class="tag-badge">
            <div class="tag-title">Bentuk Wajah</div>
            <div id="resFaceShape" class="tag-value">-</div>
          </div>
          <div class="tag-badge">
            <div class="tag-title">Tone Kulit</div>
            <div id="resSkinTone" class="tag-value">-</div>
          </div>
        </div>

        <div id="fitCheckerCard" class="fit-checker-card" style="display: none;">
          <div class="fit-header">
            <div class="fit-title" id="fitFrameName">👓 Kacamata Saat Ini</div>
            <div id="fitBadge" class="fit-score">0%</div>
          </div>
          <div class="fit-desc" id="fitReason">-</div>
        </div>

        <div class="section-title">✨ Model Frame yang Cocok</div>
        <div id="matchFramesList"></div>

        <div class="section-title">🎨 Pilihan Warna Frame</div>
        <div id="colorsList" class="colors-grid"></div>

        <div class="section-title" style="color: #f87171;">🚫 Frame yang Dihindari</div>
        <div id="avoidFramesList"></div>
      </div>

    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const scanLaser = document.getElementById('scanLaser');
    const progressBox = document.getElementById('progressBox');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const progressBarFill = document.getElementById('progressBarFill');
    const resultContainer = document.getElementById('resultContainer');

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playScanSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch (e) {}
    }

    function playSuccessSound() {
      try {
        initAudio();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.07);
          osc.stop(audioCtx.currentTime + idx * 0.07 + 0.35);
        });
      } catch (e) {}
    }

    window.onload = function() {
      startLiveMirror();
    };

    async function startLiveMirror() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Harap izinkan akses kamera di Chrome.");
      }
    }

    // Katalog Ikon Vektor Kacamata Lengkap
    function getGlassesSvg(shapeType, isAvoid = false) {
      const color = isAvoid ? "#ef4444" : "#38bdf8";
      const type = (shapeType || "").toLowerCase();
      let shapes = "";

      if (type.includes("round") || type.includes("bulat")) {
        shapes = `
          <circle cx="27" cy="20" r="14" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M41 18 Q50 14 59 18" fill="none" stroke="${color}" stroke-width="2.5"/>
          <circle cx="73" cy="20" r="14" fill="none" stroke="${color}" stroke-width="2.5"/>
        `;
      } else if (type.includes("oval")) {
        shapes = `
          <ellipse cx="27" cy="20" rx="15" ry="11" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M42 19 Q50 16 58 19" fill="none" stroke="${color}" stroke-width="2.5"/>
          <ellipse cx="73" cy="20" rx="15" ry="11" fill="none" stroke="${color}" stroke-width="2.5"/>
        `;
      } else if (type.includes("cat")) {
        shapes = `
          <path d="M12 24 C10 13, 26 9, 43 13 C45 21, 35 27, 24 27 Z" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M43 17 L57 17" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M88 24 C90 13, 74 9, 57 13 C55 21, 65 27, 76 27 Z" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
        `;
      } else if (type.includes("butterfly") || type.includes("kupu")) {
        shapes = `
          <path d="M12 10 Q28 14 42 16 Q38 32 20 30 Q10 24 12 10 Z" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M42 17 L58 17" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M88 10 Q72 14 58 16 Q62 32 80 30 Q90 24 88 10 Z" fill="none" stroke="${color}" stroke-width="2.5"/>
        `;
      } else if (type.includes("aviat")) {
        shapes = `
          <path d="M14 13 C14 13, 26 11, 42 13 C43 24, 34 31, 26 31 C18 31, 14 23, 14 13 Z" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M42 13 L58 13 M43 18 L57 18" fill="none" stroke="${color}" stroke-width="2"/>
          <path d="M58 13 C74 11, 86 13, 86 13 C86 23, 82 31, 74 31 C66 31, 57 24, 58 13 Z" fill="none" stroke="${color}" stroke-width="2.5"/>
        `;
      } else if (type.includes("half") || type.includes("clubmaster")) {
        shapes = `
          <path d="M13 12 L43 15 L39 20 L16 19 Z" fill="${color}" stroke="${color}" stroke-width="1"/>
          <path d="M16 19 C18 28, 36 29, 39 20" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="2 1"/>
          <path d="M43 16 Q50 14 57 16" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M87 12 L57 15 L61 20 L84 19 Z" fill="${color}" stroke="${color}" stroke-width="1"/>
          <path d="M84 19 C82 28, 64 29, 61 20" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="2 1"/>
        `;
      } else if (type.includes("rimless") || type.includes("frameless") || type.includes("tanpa")) {
        shapes = `
          <rect x="15" y="12" width="28" height="17" rx="3" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="3 2"/>
          <circle cx="17" cy="20" r="1.5" fill="${color}"/>
          <circle cx="41" cy="20" r="1.5" fill="${color}"/>
          <path d="M43 20 L57 20" fill="none" stroke="${color}" stroke-width="2.5"/>
          <circle cx="59" cy="20" r="1.5" fill="${color}"/>
          <circle cx="83" cy="20" r="1.5" fill="${color}"/>
          <rect x="57" y="12" width="28" height="17" rx="3" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="3 2"/>
        `;
      } else if (type.includes("hex") || type.includes("geom")) {
        shapes = `
          <polygon points="20,11 36,11 44,20 36,29 20,29 12,20" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M44 20 L56 20" fill="none" stroke="${color}" stroke-width="2.5"/>
          <polygon points="64,11 80,11 88,20 80,29 64,29 56,20" fill="none" stroke="${color}" stroke-width="2.5"/>
        `;
      } else if (type.includes("wayfarer")) {
        shapes = `
          <path d="M13 11 L43 14 L39 27 L18 26 Z" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M43 15 Q50 13 57 15" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M57 14 L87 11 L82 26 L61 27 Z" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
        `;
      } else {
        shapes = `
          <rect x="14" y="11" width="30" height="18" rx="3" fill="none" stroke="${color}" stroke-width="2.5"/>
          <path d="M44 19 L56 19" fill="none" stroke="${color}" stroke-width="2.5"/>
          <rect x="56" y="11" width="30" height="18" rx="3" fill="none" stroke="${color}" stroke-width="2.5"/>
        `;
      }

      const strike = isAvoid ? `<line x1="8" y1="32" x2="92" y2="8" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>` : "";
      return `<svg viewBox="0 0 100 40">${shapes}${strike}</svg>`;
    }

    // Fungsi Fetch dengan Auto-Retry jika Server Google Sibuk
    async function fetchWithRetry(url, options, maxRetries = 3) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const res = await fetch(url, options);
          const data = await res.json();
          if (res.ok && !data.error) return data;
          
          // Jika server Google padat, tunggu 1,5 detik lalu coba lagi otomatis
          if (data.error && (data.error.code === 503 || data.error.message.includes('demand'))) {
            if (i < maxRetries - 1) {
              progressText.innerText = `⏳ Server padat, mencoba ulang otomatis (${i + 1}/${maxRetries})...`;
              await new Promise(r => setTimeout(r, 1500));
              continue;
            }
          }
          throw new Error(data.error?.message || "Gagal memproses gambar");
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          await new Promise(r => setTimeout(r, 1500));
        }
      }
    }

    async function captureAndAnalyze() {
      let apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        apiKey = prompt("Masukkan Kunci API Gemini Anda:");
        if (apiKey) {
          localStorage.setItem("gemini_api_key", apiKey.trim());
        } else {
          return;
        }
      }

      playScanSound();
      scanLaser.style.display = "block";

      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Image = dataUrl.split(',')[1];

      analyzeBtn.disabled = true;
      resultContainer.style.display = "none";
      progressBox.style.display = "block";
      
      let progress = 10;
      progressBarFill.style.width = progress + "%";
      progressPercent.innerText = progress + "%";
      progressText.innerText = "⏳ Memindai kontur wajah...";

      const progressInterval = setInterval(() => {
        if (progress < 85) {
          progress += Math.floor(Math.random() * 8) + 4;
          if (progress > 85) progress = 85;
          progressBarFill.style.width = progress + "%";
          progressPercent.innerText = progress + "%";

          if (progress > 60) {
            progressText.innerText = "✨ Menilai kecocokan model bingkai...";
          } else if (progress > 30) {
            progressText.innerText = "🔍 Menganalisis proporsi & warna...";
          }
        }
      }, 350);

      const promptText = `Analisis foto wajah pelanggan optik ini. 
Keluarkan HANYA format JSON valid tanpa markdown, tanpa teks pembuka/penutup persis seperti skema ini:
{
  "bentuk_wajah": "Bulat",
  "tone_kulit": "Sawo Matang",
  "kacamata_dipakai": {
    "sedang_memakai": true,
    "nama": "Frame Bulat Full-Rim Hitam",
    "persen": 55,
    "status": "Kurang Cocok",
    "alasan": "Bentuk bulat membuat pipi tampak lebih penuh. Disarankan memilih frame bersudut kotak."
  },
  "frame_cocok": [
    {"nama": "Kotak / Rectangular", "tipe": "square", "alasan": "Sudut tegas menyeimbangkan kebulatan pipi"},
    {"nama": "Wayfarer", "tipe": "wayfarer", "alasan": "Memberi ilusi wajah lebih tegas & proporsional"}
  ],
  "warna_frame": [
    {"nama": "Tortoise / Havana", "hex": "#703816"},
    {"nama": "Hitam Matte", "hex": "#222222"},
    {"nama": "Rose Gold", "hex": "#b76e79"}
  ],
  "frame_hindari": [
    {"nama": "Bulat Penuh (Round)", "tipe": "round", "alasan": "Mempertegas bentuk wajah bulat"}
  ]
}

Pilihan tipe kacamata: "square", "wayfarer", "cateye", "butterfly", "round", "oval", "aviator", "halfframe", "rimless", "hexagonal".
Jika di foto pelanggan TIDAK memakai kacamata, buat "sedang_memakai": false.`;

      try {
        const data = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        }, 3);

        const rawText = data.candidates[0].content.parts[0].text;
        const res = JSON.parse(rawText);

        clearInterval(progressInterval);
        progressBarFill.style.width = "100%";
        progressPercent.innerText = "100%";
        progressText.innerText = "✅ Analisis Selesai!";

        playSuccessSound();

        document.getElementById('resFaceShape').innerText = res.bentuk_wajah || "-";
        document.getElementById('resSkinTone').innerText = res.tone_kulit || "-";

        const fitCard = document.getElementById('fitCheckerCard');
        if (res.kacamata_dipakai && res.kacamata_dipakai.sedang_memakai) {
          const fit = res.kacamata_dipakai;
          document.getElementById('fitFrameName').innerText = `👓 Sedang Mencoba: ${fit.nama || 'Kacamata'}`;
          const badge = document.getElementById('fitBadge');
          const pct = fit.persen || 50;
          badge.innerText = `${pct}% ${fit.status || ''}`;
          badge.className = "fit-score " + (pct >= 75 ? "score-high" : (pct >= 50 ? "score-med" : "score-low"));
          document.getElementById('fitReason').innerText = fit.alasan || "";
          fitCard.style.display = "block";
        } else {
          fitCard.style.display = "none";
        }

        let matchHtml = "";
        (res.frame_cocok || []).forEach(f => {
          matchHtml += `
            <div class="frame-card">
              <div class="frame-icon-wrap">${getGlassesSvg(f.tipe, false)}</div>
              <div class="frame-info">
                <div class="frame-name">${f.nama}</div>
                <div class="frame-desc">${f.alasan}</div>
              </div>
            </div>`;
        });
        document.getElementById('matchFramesList').innerHTML = matchHtml;

        let colorsHtml = "";
        (res.warna_frame || []).forEach(c => {
          colorsHtml += `
            <div class="color-chip">
              <span class="color-dot" style="background: ${c.hex || '#333'};"></span>
              <span>${c.nama}</span>
            </div>`;
        });
        document.getElementById('colorsList').innerHTML = colorsHtml;

        let avoidHtml = "";
        (res.frame_hindari || []).forEach(f => {
          avoidHtml += `
            <div class="frame-card avoid">
              <div class="frame-icon-wrap">${getGlassesSvg(f.tipe, true)}</div>
              <div class="frame-info">
                <div class="frame-name" style="color: #fca5a5;">${f.nama}</div>
                <div class="frame-desc">${f.alasan}</div>
              </div>
            </div>`;
        });
        document.getElementById('avoidFramesList').innerHTML = avoidHtml;

        setTimeout(() => {
          progressBox.style.display = "none";
          resultContainer.style.display = "block";
        }, 400);

      } catch (err) {
        console.error(err);
        alert("Server Google sedang sangat sibuk. Silakan sentuh 'Mulai Analisis' sekali lagi.");
      } finally {
        clearInterval(progressInterval);
        scanLaser.style.display = "none";
        analyzeBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
