<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vrandolv</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; margin: 0; padding: 12px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 20px; padding: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    
    /* Header Brand Rapat */
    .brand-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 4px;
      margin: 4px 0 14px;
    }
    .brand-logo {
      height: 22px;
      width: auto;
      object-fit: contain;
      margin: 0;
      padding: 0;
      display: inline-block;
    }
    .brand-title {
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0px;
      line-height: 1;
      display: inline-block;
    }
    
    /* Layar Cermin */
    .mirror-box {
      width: 100%;
      height: 52vh;
      min-height: 360px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #0284c7;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.35);
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas { display: none; }
    
    .btn { display: block; width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 12px; transition: 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #475569; color: #94a3b8; box-shadow: none; }
    
    /* Progress Box Bertahap */
    .progress-box {
      display: none;
      margin-top: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 14px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .progress-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-percent {
      font-weight: 700;
      min-width: 38px;
      text-align: right;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 8px;
      transition: width 0.15s ease-out;
    }
    
    .result-container { margin-top: 16px; display: none; }
    
    /* Analisis Kacamata Terpakai */
    .current-glasses-card {
      background: #0f172a;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
    }
    .cg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cg-status { font-size: 13px; font-weight: 700; color: #f8fafc; }
    .cg-score-pill { background: #0284c7; color: #fff; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .cg-eval { font-size: 12px; color: #cbd5e1; line-height: 1.45; }
    
    .tags-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .tag-badge { flex: 1; background: #0f172a; padding: 10px; border-radius: 12px; border: 1px solid #38bdf8; text-align: center; }
    .tag-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
    .tag-value { font-size: 15px; font-weight: bold; color: #38bdf8; }
    
    .section-title { font-size: 13px; font-weight: bold; color: #cbd5e1; margin: 16px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Slider Virtual Try-On */
    .carousel-slider {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-slider::-webkit-scrollbar { height: 5px; }
    .carousel-slider::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    .tryon-card {
      flex: 0 0 250px;
      scroll-snap-align: start;
      background: #0f172a;
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tryon-card.avoid {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }
    
    .tryon-image-wrap {
      width: 100%;
      height: 240px;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .tryon-image-wrap img.face-shot {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tryon-glasses-img {
      position: absolute;
      transform-origin: center center;
      pointer-events: none;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.65));
    }
    
    .tryon-details {
      padding: 10px 12px;
      flex: 1;
    }
    .tryon-name {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .tryon-card.avoid .tryon-name {
      color: #f87171;
    }
    .tryon-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    
    /* Palet Warna */
    .colors-grid { display: flex; flex-wrap: wrap; gap: 10px; background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    .color-chip { display: flex; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 13px; border: 1px solid #475569; }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; margin-right: 8px; border: 1.5px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5); flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">Vrandolv</span>
      </div>

      <!-- Layar Cermin -->
      <div class="mirror-box">
        <video id="video" autoplay playsinline muted></video>
      </div>
      <canvas id="canvas"></canvas>

      <button id="analyzeBtn" class="btn" onclick="captureAndAnalyze()">Mulai Analisis</button>
      
      <!-- Progress Bar Halus Bertahap -->
      <div id="progressBox" class="progress-box">
        <div class="progress-labels">
          <span id="progressText" class="progress-text">Mengidentifikasi wajah...</span>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      
      <!-- Hasil Analisis -->
      <div id="resultContainer" class="result-container">
        <!-- Hasil Kacamata Saat Ini -->
        <div id="currentGlassesContainer"></div>

        <div class="tags-row">
          <div class="tag-badge">
            <div class="tag-title">Bentuk Wajah</div>
            <div id="resFaceShape" class="tag-value">-</div>
          </div>
          <div class="tag-badge">
            <div class="tag-title">Tone Kulit</div>
            <div id="resSkinTone" class="tag-value">-</div>
          </div>
        </div>

        <div class="section-title">✨ Frame Cocok (Geser ke Kanan ➔)</div>
        <div id="matchFramesSlider" class="carousel-slider"></div>

        <div class="section-title">🎨 Pilihan Warna Frame</div>
        <div id="colorsList" class="colors-grid"></div>

        <div class="section-title" style="color: #f87171;">🚫 Frame Dihindari (Geser ke Kanan ➔)</div>
        <div id="avoidFramesSlider" class="carousel-slider"></div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const resultContainer = document.getElementById('resultContainer');

    let progressInterval = null;
    let currentVal = 0;
    let capturedPhotoUrl = "";

    // Kumpulan Aset Gambar Kacamata Real Transparan
    const realGlassesMap = {
      "square": "https://images.squarespace-cdn.com/content/v1/59306b6bb8a79b9409868779/1594917540263-L9G73J8ZVRR0XF8L8N8C/Glasses-PNG-Cutout.png",
      "wayfarer": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-Free-Download-PNG.png",
      "round": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-PNG-File.png",
      "aviator": "https://www.pngall.com/wp-content/uploads/2016/05/Sun-Glasses-PNG-Picture.png",
      "cateye": "https://www.pngall.com/wp-content/uploads/2016/05/Eyeglasses-PNG-Image.png",
      "geometric": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-PNG-Clipart.png",
      "rimless": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-PNG-HD.png",
      "half-frame": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-PNG-Image.png",
      "butterfly": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-Download-PNG.png",
      "oval": "https://www.pngall.com/wp-content/uploads/2016/05/Glasses-PNG-Picture.png"
    };

    function getRealGlassesUrl(type) {
      const key = (type || "").toLowerCase();
      for (const [k, url] of Object.entries(realGlassesMap)) {
        if (key.includes(k)) return url;
      }
      return realGlassesMap["square"];
    }

    window.onload = function() {
      startLiveMirror();
    };

    async function startLiveMirror() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert(err.name + ": " + err.message);
      }
    }

    function setProgressBar(percent) {
      progressBar.style.width = percent + "%";
      progressPercent.innerText = Math.round(percent) + "%";

      if (percent < 25) {
        progressText.innerText = "Mengidentifikasi kontur wajah...";
      } else if (percent < 50) {
        progressText.innerText = "Mendeteksi proporsi mata dan hidung...";
      } else if (percent < 75) {
        progressText.innerText = "Mencocokkan geometri frame...";
      } else if (percent < 95) {
        progressText.innerText = "Memasang fitting kacamata realistis...";
      } else {
        progressText.innerText = "Menyusun rekomendasi akhir...";
      }
    }

    function startProgress() {
      progressBox.style.display = "block";
      currentVal = 0;
      setProgressBar(0);
      clearInterval(progressInterval);
      
      // Progres naik teratur dan konstan secara bertahap
      progressInterval = setInterval(() => {
        if (currentVal < 90) {
          currentVal += 1.2;
          setProgressBar(currentVal);
        }
      }, 100);
    }

    function finishProgress(callback) {
      clearInterval(progressInterval);
      const finishTimer = setInterval(() => {
        if (currentVal < 100) {
          currentVal += 2.5;
          setProgressBar(Math.min(100, currentVal));
        } else {
          clearInterval(finishTimer);
          setTimeout(() => {
            progressBox.style.display = "none";
            if (callback) callback();
          }, 350);
        }
      }, 30);
    }

    // Render Kartu Try-On Menggunakan Aset Kacamata Real
    function createRealTryonCard(frame, photoUrl, eyeData, isAvoid = false) {
      const lx = eyeData?.kiri?.[0] ?? 42;
      const ly = eyeData?.kiri?.[1] ?? 42;
      const rx = eyeData?.kanan?.[0] ?? 58;
      const ry = eyeData?.kanan?.[1] ?? 42;

      const eyeDistance = Math.hypot(rx - lx, ry - ly);
      const angle = Math.atan2(ry - ly, rx - lx) * (180 / Math.PI);
      const centerX = (lx + rx) / 2;
      const centerY = (ly + ry) / 2;

      // Rasio ukuran kacamata real proporsional terhadap jarak pupil
      const frameWidthPercent = Math.max(50, Math.min(eyeDistance * 2.75, 82));
      const glassesImgSrc = getRealGlassesUrl(frame.tipe);

      return `
        <div class="tryon-card ${isAvoid ? 'avoid' : ''}">
          <div class="tryon-image-wrap">
            <img src="${photoUrl}" class="face-shot" alt="Wajah">
            <img src="${glassesImgSrc}" class="tryon-glasses-img" style="
              width: ${frameWidthPercent}%;
              left: ${centerX}%;
              top: ${centerY}%;
              transform: translate(-50%, -50%) rotate(${angle}deg);
            " alt="${frame.nama}">
          </div>
          <div class="tryon-details">
            <div class="tryon-name">${frame.nama}</div>
            <div class="tryon-desc">${frame.alasan}</div>
          </div>
        </div>
      `;
    }

    async function captureAndAnalyze() {
      let apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        apiKey = prompt("API Key:");
        if (apiKey) {
          localStorage.setItem("gemini_api_key", apiKey.trim());
        } else {
          return;
        }
      }

      // Ambil frame cermin
      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      capturedPhotoUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Image = capturedPhotoUrl.split(',')[1];

      analyzeBtn.disabled = true;
      resultContainer.style.display = "none";
      startProgress();

      const promptText = `Periksa foto wajah ini. Deteksi titik pusat kedua pupil mata dalam persentase gambar (0-100), periksa apakah sedang mengenakan kacamata, analisis bentuk wajah, dan beri rekomendasi frame.
Keluarkan HANYA format JSON valid persis seperti skema ini:
{
  "posisi_mata": {
    "kiri": [42.5, 41.2],
    "kanan": [58.5, 41.2]
  },
  "sedang_memakai_kacamata": false,
  "evaluasi_kacamata_sekarang": null,
  "bentuk_wajah": "Oval",
  "tone_kulit": "Kuning Langsat",
  "frame_cocok": [
    {"nama": "Kotak / Rectangular", "tipe": "square", "alasan": "Menambah definisi dan kontras yang seimbang pada struktur wajah."},
    {"nama": "Wayfarer", "tipe": "wayfarer", "alasan": "Tampilan klasik dan fleksibel untuk hampir semua situasi."},
    {"nama": "Geometric Hexagon", "tipe": "geometric", "alasan": "Memberikan aksen tegas tanpa merusak proporsi alami."}
  ],
  "warna_frame": [
    {"nama": "Tortoise / Havana", "hex": "#703816"},
    {"nama": "Hitam Matte", "hex": "#222222"},
    {"nama": "Cokelat Tua", "hex": "#4a2e18"}
  ],
  "frame_hindari": [
    {"nama": "Bulat Penuh (Round) Kecil", "tipe": "round", "alasan": "Ukuran kecil membuat wajah tampak tidak seimbang."}
  ]
}
Catatan posisi_mata adalah koordinat persentase [X, Y] dari sudut kiri-atas (0-100%).
Pilihan nilai 'tipe' frame: "square", "wayfarer", "cateye", "round", "aviator", "rimless", "half-frame", "butterfly", "geometric", "oval".`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          clearInterval(progressInterval);
          progressBox.style.display = "none";
          alert("Error " + (data.error.code || "") + ": " + data.error.message);
          return;
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const res = JSON.parse(rawText);

        finishProgress(() => {
          // Render Analisis Kacamata Terpakai
          const currentContainer = document.getElementById('currentGlassesContainer');
          if (res.sedang_memakai_kacamata && res.evaluasi_kacamata_sekarang) {
            const evalData = res.evaluasi_kacamata_sekarang;
            currentContainer.innerHTML = `
              <div class="current-glasses-card">
                <div class="cg-top">
                  <span class="cg-status">👓 Kacamata Saat Ini</span>
                  <span class="cg-score-pill">Kecocokan: ${evalData.skor_cocok || 0}%</span>
                </div>
                <div class="cg-eval">${evalData.deskripsi || ""}</div>
              </div>`;
            currentContainer.style.display = "block";
          } else {
            currentContainer.innerHTML = "";
            currentContainer.style.display = "none";
          }

          // Tampilkan Bentuk Wajah & Tone Kulit
          document.getElementById('resFaceShape').innerText = res.bentuk_wajah || "-";
          document.getElementById('resSkinTone').innerText = res.tone_kulit || "-";

          // Render Slider Frame Cocok (Virtual Try-on Real)
          let matchSliderHtml = "";
          (res.frame_cocok || []).forEach(f => {
            matchSliderHtml += createRealTryonCard(f, capturedPhotoUrl, res.posisi_mata, false);
          });
          document.getElementById('matchFramesSlider').innerHTML = matchSliderHtml;

          // Render Palet Warna
          let colorsHtml = "";
          (res.warna_frame || []).forEach(c => {
            colorsHtml += `
              <div class="color-chip">
                <span class="color-dot" style="background: ${c.hex || '#333'};"></span>
                <span>${c.nama}</span>
              </div>`;
          });
          document.getElementById('colorsList').innerHTML = colorsHtml;

          // Render Slider Frame Dihindari (Virtual Try-on Real)
          let avoidSliderHtml = "";
          (res.frame_hindari || []).forEach(f => {
            avoidSliderHtml += createRealTryonCard(f, capturedPhotoUrl, res.posisi_mata, true);
          });
          document.getElementById('avoidFramesSlider').innerHTML = avoidSliderHtml;

          resultContainer.style.display = "block";
        });
      } catch (err) {
        clearInterval(progressInterval);
        progressBox.style.display = "none";
        console.error(err);
        alert(err.message || String(err));
      } finally {
        analyzeBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
