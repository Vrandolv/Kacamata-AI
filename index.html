<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Konsultasi Frame & Gaya Kacamata</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; margin: 0; padding: 16px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h2 { margin: 0 0 16px; color: #38bdf8; text-align: center; font-size: 20px; }
    .btn { display: block; width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 12px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #475569; color: #94a3b8; }
    .btn-action { background: #10b981; }
    #preview { width: 100%; max-height: 380px; object-fit: contain; border-radius: 12px; margin-top: 14px; display: none; background: #000; border: 2px solid #38bdf8; }
    .result-box { margin-top: 18px; padding: 16px; background: #0f172a; border-left: 4px solid #38bdf8; border-radius: 10px; line-height: 1.6; font-size: 14px; color: #e2e8f0; }
    .result-box h4 { margin: 12px 0 4px; color: #38bdf8; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    details { margin-bottom: 14px; font-size: 13px; color: #94a3b8; }
    summary { cursor: pointer; color: #38bdf8; }
    .loading { text-align: center; font-weight: bold; color: #38bdf8; margin-top: 16px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>👓 Konsultasi Wajah & Frame</h2>
      
      <!-- Pengaturan API Key -->
      <details>
        <summary>⚙️ Pengaturan Kunci API (Buka sekali di awal)</summary>
        <div style="margin-top: 10px;">
          <input type="text" id="apiKeyInput" placeholder="Tempel Gemini API Key di sini...">
          <button class="btn" style="padding: 10px; font-size: 13px;" onclick="saveApiKey()">Simpan Kunci ke HP</button>
        </div>
      </details>

      <!-- Kamera Depan -->
      <label for="cameraInput" class="btn">📸 Buka Kamera Depan / Foto</label>
      <input type="file" id="cameraInput" accept="image/*" capture="user" style="display: none;" onchange="handleImage(event)">

      <img id="preview" alt="Preview Foto">
      
      <button id="analyzeBtn" class="btn btn-action" style="display: none;" onclick="analyzeFace()">🔍 Analisis Wajah & Kacamata</button>
      
      <div id="loading" class="loading">⏳ Sedang menganalisis proporsi wajah dan warna kulit...</div>
      <div id="result" class="result-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    let base64Image = "";

    window.onload = function() {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      }
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("gemini_api_key", key);
        alert("API Key berhasil disimpan di HP!");
      }
    }

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById("preview");
        preview.src = e.target.result;
        preview.style.display = "block";
        base64Image = e.target.result.split(',')[1];
        document.getElementById("analyzeBtn").style.display = "block";
        document.getElementById("result").style.display = "none";
      };
      reader.readAsDataURL(file);
    }

    async function analyzeFace() {
      const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) {
        alert("Harap masukkan dan simpan Gemini API Key di menu Pengaturan terlebih dahulu.");
        return;
      }

      const loading = document.getElementById("loading");
      const resultBox = document.getElementById("result");
      const analyzeBtn = document.getElementById("analyzeBtn");

      loading.style.display = "block";
      analyzeBtn.disabled = true;
      resultBox.style.display = "none";

      const promptText = `Bertindaklah sebagai konsultan optik dan stylist kacamata profesional. Analisis foto wajah ini dengan cermat dan berikan rekomendasi dalam format poin-poin berikut:

1. **Bentuk Wajah**: Sebutkan bentuknya (Bulat, Kotak, Oval, Hati, atau Lonjong) beserta analisis singkat garis rahang dan proporsinya.
2. **Tone Kulit & Undertone**: Sebutkan kategori tone kulit (misal: Sawo Matang, Kuning Langsat, Cerah) dan undertone (Warm, Cool, atau Neutral).
3. **Model Kacamata yang Cocok**: Rekomendasikan 2–3 model bingkai spesifik (misal: Wayfarer, Persegi Panjang, Bulat, Aviator, Cat-Eye) beserta alasan estetika penyeimbangnya.
4. **Warna Frame yang Disarankan**: Berikan rekomendasi warna bingkai (misal: Tortoise/Havana, Emas, Silver, Hitam Doff, Karamel) yang paling membuat kulit wajah terlihat cerah.
5. **Model/Warna yang Dihindari**: Sebutkan bentuk atau warna frame yang sebaiknya dihindari agar wajah tidak tampak terlalu kaku, kusam, atau bulat.
6. **Catatan Khusus**: Jika pada foto orang ini SUDAH memakai kacamata, beri evaluasi: Apakah kacamata yang dipakai saat ini sudah cocok atau belum, dan apa yang bisa diperbaiki.

Gunakan bahasa Indonesia yang ramah, santun, dan percaya diri layaknya konsultan profesional.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          let text = data.candidates[0].content.parts[0].text;
          text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          resultBox.innerHTML = text.replace(/\n/g, "<br>");
          resultBox.style.display = "block";
        } else {
          resultBox.innerHTML = "Gagal memproses gambar. Pastikan wajah terlihat jelas dan pencahayaan cukup.";
          resultBox.style.display = "block";
        }
      } catch (err) {
        resultBox.innerHTML = "Terjadi kesalahan: " + err.message;
        resultBox.style.display = "block";
      } finally {
        loading.style.display = "none";
        analyzeBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
