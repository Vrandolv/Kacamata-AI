<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Mirror Optik - Konsultasi Frame</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; margin: 0; padding: 12px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 16px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h2 { margin: 0 0 12px; color: #38bdf8; text-align: center; font-size: 19px; }
    
    /* Layar Cermin Live */
    .mirror-box {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 2px solid #38bdf8;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efek Cermin (Mirror) */
    }
    canvas { display: none; }
    
    .btn { display: block; width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 10px; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #475569; color: #94a3b8; }
    .btn-action { background: #10b981; }
    
    .result-box { margin-top: 16px; padding: 16px; background: #0f172a; border-left: 4px solid #38bdf8; border-radius: 10px; line-height: 1.6; font-size: 14px; color: #e2e8f0; display: none; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    details { margin-bottom: 12px; font-size: 13px; color: #94a3b8; }
    summary { cursor: pointer; color: #38bdf8; }
    .loading { text-align: center; font-weight: bold; color: #38bdf8; margin-top: 14px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>👓 Smart Mirror Konsultasi Optik</h2>
      
      <!-- Pengaturan Kunci API -->
      <details>
        <summary>⚙️ Pengaturan Kunci API (Klik untuk cek/ubah)</summary>
        <div style="margin-top: 10px;">
          <input type="text" id="apiKeyInput" placeholder="Tempel Gemini API Key di sini...">
          <button class="btn" style="padding: 10px; font-size: 13px;" onclick="saveApiKey()">Simpan Kunci ke HP</button>
        </div>
      </details>

      <!-- Tampilan Cermin Kamera Depan -->
      <div class="mirror-box">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas"></canvas>

      <button id="analyzeBtn" class="btn btn-action" onclick="captureAndAnalyze()">🔍 Analisis Wajah & Kacamata Sekarang</button>
      
      <div id="loading" class="loading">⏳ Sedang membaca bentuk wajah dan warna kulit...</div>
      <div id="result" class="result-box"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('result');

    window.onload = function() {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      }
      startCamera();
    };

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("gemini_api_key", key);
        alert("API Key berhasil disimpan di HP!");
      }
    }

    // Mengaktifkan Kamera Depan Langsung di Layar Web
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error(err);
        alert("Harap izinkan akses kamera di browser agar cermin bisa menyala.");
      }
    }

    async function captureAndAnalyze() {
      const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) {
        alert("Harap masukkan dan simpan Gemini API Key di Pengaturan terlebih dahulu.");
        return;
      }

      // Ambil frame langsung dari cermin video
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Image = dataUrl.split(',')[1];

      loading.style.display = "block";
      analyzeBtn.disabled = true;
      resultBox.style.display = "none";

      const promptText = `Bertindaklah sebagai konsultan optik dan stylist kacamata profesional. Analisis foto wajah ini dengan cermat dan berikan rekomendasi dalam format poin-poin berikut:

1. **Bentuk Wajah**: Sebutkan bentuknya (Bulat, Kotak, Oval, Hati, atau Lonjong) beserta analisis singkat garis rahang dan proporsinya.
2. **Tone Kulit & Undertone**: Sebutkan kategori tone kulit (misal: Sawo Matang, Kuning Langsat, Cerah) dan undertone (Warm, Cool, atau Neutral).
3. **Model Kacamata yang Cocok**: Rekomendasikan 2–3 model bingkai spesifik (misal: Wayfarer, Persegi Panjang, Bulat, Aviator, Cat-Eye) beserta alasan estetika penyeimbangnya.
4. **Warna Frame yang Disarankan**: Berikan rekomendasi warna bingkai (misal: Tortoise/Havana, Emas, Silver, Hitam Doff, Karamel) yang paling membuat kulit wajah terlihat cerah.
5. **Model/Warna yang Dihindari**: Sebutkan bentuk atau warna frame yang sebaiknya dihindari agar wajah tidak tampak terlalu kaku, kusam, atau bulat.
6. **Catatan Khusus**: Jika pada foto orang ini SUDAH memakai kacamata, beri evaluasi: Apakah kacamata yang dipakai saat ini sudah cocok atau belum, dan apa yang bisa diperbaiki.

Gunakan bahasa Indonesia yang ramah, santun, dan percaya diri layaknya konsultan profesional.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }]
          })
        });

        const data = await response.json();

        if (data.error) {
          resultBox.innerHTML = `<strong>Error dari Google:</strong> ${data.error.message || JSON.stringify(data.error)}`;
          resultBox.style.display = "block";
          return;
        }

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          let text = data.candidates[0].content.parts[0].text;
          text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          resultBox.innerHTML = text.replace(/\n/g, "<br>");
          resultBox.style.display = "block";
        } else {
          resultBox.innerHTML = "Gagal memproses gambar. AI tidak dapat membaca wajah.";
          resultBox.style.display = "block";
        }
      } catch (err) {
        resultBox.innerHTML = "Terjadi kesalahan koneksi: " + err.message;
        resultBox.style.display = "block";
      } finally {
        loading.style.display = "none";
        analyzeBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
