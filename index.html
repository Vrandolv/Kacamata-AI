<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vrandolv</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; margin: 0; padding: 12px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 20px; padding: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    
    /* Header Brand Rapat */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 4px 0 14px;
    }
    .brand-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      margin-right: -4px;
      padding: 0;
      display: block;
    }
    .brand-title {
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1;
      display: block;
    }
    
    /* Layar Cermin */
    .mirror-box {
      width: 100%;
      height: 52vh;
      min-height: 360px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #d4af37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    canvas { display: none; }

    /* Panduan Garis Wajah Proporsional & Lebih Lebar */
    .face-guide-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .guide-svg-wrap {
      width: 90%;
      height: 86%;
      position: relative;
    }
    .guide-svg-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
    }
    
    /* Posisi Ikon Mata Lebih Besar & Lebih Dekat */
    .guide-eyes-wrap {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 56%;
      display: flex;
      justify-content: space-between;
    }
    .guide-eye-shape {
      width: 58px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }
    .guide-tip {
      position: absolute;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #ffffff;
      letter-spacing: 0.3px;
    }
    
    /* Tombol Mulai Analisis */
    .btn { 
      display: block; 
      width: 100%; 
      padding: 15px; 
      background: linear-gradient(135deg, #f59e0b, #d4af37); 
      color: #0b1120; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 800; 
      cursor: pointer; 
      text-align: center; 
      margin-top: 12px; 
      transition: 0.2s; 
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35); 
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #475569; color: #94a3b8; box-shadow: none; }
    
    /* Progress Box Bertahap */
    .progress-box {
      display: none;
      margin-top: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 14px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 8px;
    }
    .progress-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .progress-percent {
      font-weight: 700;
      min-width: 38px;
      text-align: right;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f59e0b);
      border-radius: 8px;
      transition: width 0.2s ease-out;
    }
    
    .result-container { margin-top: 16px; display: none; }
    
    .tags-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .tag-badge { flex: 1; background: #0f172a; padding: 10px; border-radius: 12px; border: 1px solid #d4af37; text-align: center; }
    .tag-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
    .tag-value { font-size: 15px; font-weight: bold; color: #fbbf24; }

    /* Kartu Penilaian Kacamata Yang Sedang Dipakai */
    .current-glasses-card {
      background: #0f172a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #d4af37;
      box-shadow: 0 0 14px rgba(212, 175, 55, 0.2);
    }
    .cg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cg-status { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .cg-score-pill { background: #d4af37; color: #0b1120; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; }
    
    .cg-content {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .cg-thumb {
      width: 82px;
      height: 82px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #334155;
    }
    .cg-eval { font-size: 13px; color: #cbd5e1; line-height: 1.5; flex: 1; margin: 0; }
    
    .section-title { font-size: 13px; font-weight: bold; color: #cbd5e1; margin: 16px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Slider Virtual Try-On */
    .carousel-slider {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-slider::-webkit-scrollbar { height: 5px; }
    .carousel-slider::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    .tryon-card {
      flex: 0 0 250px;
      scroll-snap-align: start;
      background: #0f172a;
      border-radius: 14px;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tryon-card.avoid {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }
    
    .tryon-image-wrap {
      width: 100%;
      height: 240px;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .tryon-image-wrap img.face-shot {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tryon-glasses-front {
      position: absolute;
      transform-origin: center center;
      pointer-events: none;
      filter: drop-shadow(0 7px 12px rgba(0,0,0,0.85));
    }
    
    .tryon-details {
      padding: 10px 12px;
      flex: 1;
    }
    .tryon-name {
      font-size: 13px;
      font-weight: bold;
      color: #fbbf24;
      margin-bottom: 4px;
    }
    .tryon-card.avoid .tryon-name {
      color: #f87171;
    }
    .tryon-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    
    /* Palet Warna */
    .colors-grid { display: flex; flex-wrap: wrap; gap: 8px; background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    .color-chip { display: flex; align-items: center; background: #1e293b; padding: 6px 10px; border-radius: 20px; font-size: 12px; border: 1px solid #475569; }
    .color-dot { width: 16px; height: 16px; border-radius: 50%; margin-right: 6px; border: 1px solid #64748b; box-shadow: 0 0 3px rgba(0,0,0,0.5); flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">Vrandolv</span>
      </div>

      <!-- Layar Cermin -->
      <div class="mirror-box">
        <video id="video" autoplay playsinline muted></video>
        
        <!-- Panduan Garis Wajah Proporsional & Lebih Lebar -->
        <div id="faceGuide" class="face-guide-overlay">
          <div class="guide-svg-wrap">
            <svg viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Lengkungan Lebih Lebar Mengikuti Proporsi Wajah Asli -->
              <path d="M 110,12 C 195,12 208,95 192,185 C 178,248 145,268 110,268 C 75,268 42,248 28,185 C 12,95 25,12 110,12 Z" 
                    stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-dasharray="6 4" />
            </svg>
            <div class="guide-eyes-wrap">
              <div class="guide-eye-shape"></div>
              <div class="guide-eye-shape"></div>
            </div>
          </div>
          <div class="guide-tip">Posisikan kedua mata di dalam garis mata</div>
        </div>
      </div>
      <canvas id="canvas"></canvas>

      <button id="analyzeBtn" class="btn" onclick="captureAndAnalyze()">Mulai Analisis</button>
      
      <!-- Progress Bar Halus Bertema Emas -->
      <div id="progressBox" class="progress-box">
        <div class="progress-labels">
          <span id="progressText" class="progress-text">Memeriksa posisi wajah...</span>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      
      <!-- Hasil Analisis -->
      <div id="resultContainer" class="result-container">
        <!-- Bentuk Wajah & Tone Kulit -->
        <div class="tags-row">
          <div class="tag-badge">
            <div class="tag-title">Bentuk Wajah</div>
            <div id="resFaceShape" class="tag-value">-</div>
          </div>
          <div class="tag-badge">
            <div class="tag-title">Tone Kulit</div>
            <div id="resSkinTone" class="tag-value">-</div>
          </div>
        </div>

        <!-- Kartu Evaluasi Kacamata Terpakai dengan Foto Asli -->
        <div id="currentGlassesContainer"></div>

        <!-- Bagian Try-on (Hanya Muncul Jika TIDAK Memakai Kacamata) -->
        <div id="tryonSection" style="display: none;">
          <div class="section-title">✨ Rekomendasi Frame</div>
          <div id="matchFramesSlider" class="carousel-slider"></div>
        </div>

        <!-- Rekomendasi Warna (Selalu Tampil) -->
        <div class="section-title">🎨 Rekomendasi Warna Frame</div>
        <div id="colorsList" class="colors-grid"></div>

        <!-- Bagian Frame Dihindari (Hanya Muncul Jika TIDAK Memakai Kacamata) -->
        <div id="avoidSection" style="display: none;">
          <div class="section-title" style="color: #f87171;">🚫 Frame Dihindari</div>
          <div id="avoidFramesSlider" class="carousel-slider"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const resultContainer = document.getElementById('resultContainer');
    const tryonSection = document.getElementById('tryonSection');
    const avoidSection = document.getElementById('avoidSection');
    const currentGlassesContainer = document.getElementById('currentGlassesContainer');

    let progressInterval = null;
    let currentVal = 0;
    let capturedPhotoUrl = "";

    function playCameraChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    window.onload = function() {
      startLiveMirror();
    };

    async function startLiveMirror() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert(err.name + ": " + err.message);
      }
    }

    function renderFrontFrameOnly(type, isAvoid = false) {
      const strokeCol = isAvoid ? "#dc2626" : "#0f172a";
      const fillCol = isAvoid ? "rgba(220, 38, 38, 0.12)" : "rgba(255, 255, 255, 0.08)";
      const highlight = isAvoid ? "#f87171" : "#e2e8f0";
      const t = (type || "").toLowerCase();

      let frameShapes = "";

      if (t.includes("rimless") || t.includes("frameless") || t.includes("bor")) {
        frameShapes = `
          <rect x="14" y="10" width="31" height="20" rx="3" fill="${fillCol}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 1"/>
          <rect x="55" y="10" width="31" height="20" rx="3" fill="${fillCol}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 1"/>
          <path d="M45 17 Q50 14 55 17" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
          <circle cx="17" cy="13" r="1.2" fill="#cbd5e1"/>
          <circle cx="83" cy="13" r="1.2" fill="#cbd5e1"/>
        `;
      } else if (t.includes("half") || t.includes("browline")) {
        frameShapes = `
          <path d="M11 11 Q28 8 45 12" fill="none" stroke="${strokeCol}" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M12 12 C12 26, 20 29, 28 29 C36 29, 44 26, 44 12" fill="${fillCol}" stroke="#64748b" stroke-width="1"/>
          <path d="M45 15 Q50 12 55 15" fill="none" stroke="${strokeCol}" stroke-width="3"/>
          <path d="M55 12 Q72 8 89 11" fill="none" stroke="${strokeCol}" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M56 12 C56 26, 64 29, 72 29 C80 29, 88 26, 88 12" fill="${fillCol}" stroke="#64748b" stroke-width="1"/>
        `;
      } else if (t.includes("round") || t.includes("bulat")) {
        frameShapes = `
          <circle cx="28" cy="20" r="14" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.8"/>
          <path d="M42 18 Q50 14 58 18" fill="none" stroke="${strokeCol}" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="72" cy="20" r="14" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.8"/>
        `;
      } else if (t.includes("aviat")) {
        frameShapes = `
          <path d="M12 13 C12 13, 26 10, 43 13 C44 25, 34 31, 26 31 C17 31, 12 24, 12 13 Z" fill="${fillCol}" stroke="${strokeCol}" stroke-width="2.5"/>
          <path d="M43 14 L57 14 M44 18 L56 18" fill="none" stroke="${strokeCol}" stroke-width="2"/>
          <path d="M57 13 C74 10, 88 13, 88 13 C88 24, 83 31, 74 31 C66 31, 56 25, 57 13 Z" fill="${fillCol}" stroke="${strokeCol}" stroke-width="2.5"/>
        `;
      } else if (t.includes("geo") || t.includes("hex") || t.includes("segi")) {
        frameShapes = `
          <polygon points="21,10 36,10 44,19 36,28 21,28 13,19" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M44 18 L56 18" fill="none" stroke="${strokeCol}" stroke-width="3.5" stroke-linecap="round"/>
          <polygon points="64,10 79,10 87,19 79,28 64,28 56,19" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.5" stroke-linejoin="round"/>
        `;
      } else if (t.includes("cat")) {
        frameShapes = `
          <path d="M11 20 C10 10, 24 8, 43 11 C45 20, 36 27, 26 27 C15 27, 11 24, 11 20 Z" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.8" stroke-linejoin="round"/>
          <path d="M43 14 L57 14" fill="none" stroke="${strokeCol}" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M89 20 C90 10, 76 8, 57 11 C55 20, 64 27, 74 27 C85 27, 89 24, 89 20 Z" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.8" stroke-linejoin="round"/>
        `;
      } else if (t.includes("wayfarer")) {
        frameShapes = `
          <path d="M12 10 L44 13 L39 28 L17 27 Z" fill="${fillCol}" stroke="${strokeCol}" stroke-width="4" stroke-linejoin="round"/>
          <path d="M44 14 Q50 12 56 14" fill="none" stroke="${strokeCol}" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M56 13 L88 10 L83 27 L61 28 Z" fill="${fillCol}" stroke="${strokeCol}" stroke-width="4" stroke-linejoin="round"/>
        `;
      } else {
        frameShapes = `
          <rect x="12" y="10" width="32" height="19" rx="3.5" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.8"/>
          <path d="M44 17 L56 17" fill="none" stroke="${strokeCol}" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="56" y="10" width="32" height="19" rx="3.5" fill="${fillCol}" stroke="${strokeCol}" stroke-width="3.8"/>
        `;
      }

      const glare = `
        <line x1="18" y1="13" x2="23" y2="24" stroke="${highlight}" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
        <line x1="62" y1="13" x2="67" y2="24" stroke="${highlight}" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
      `;

      return `
        <svg viewBox="0 0 100 40" style="width:100%; height:100%; display:block;" xmlns="http://www.w3.org/2000/svg">
          ${frameShapes}
          ${glare}
        </svg>
      `;
    }

    function setProgressBar(percent) {
      progressBar.style.width = percent + "%";
      progressPercent.innerText = Math.round(percent) + "%";

      if (percent < 20) {
        progressText.innerText = "Memeriksa pencahayaan & posisi wajah...";
      } else if (percent < 45) {
        progressText.innerText = "Mengecek apakah memakai kacamata & kontur rahang...";
      } else if (percent < 70) {
        progressText.innerText = "Menganalisis proporsi kesesuaian bingkai...";
      } else if (percent < 90) {
        progressText.innerText = "Mengkalkulasi tone kulit & warna frame...";
      } else {
        progressText.innerText = "Menyelesaikan kurasi rekomendasi...";
      }
    }

    function startProgress() {
      progressBox.style.display = "block";
      currentVal = 0;
      setProgressBar(0);
      clearInterval(progressInterval);
      
      progressInterval = setInterval(() => {
        if (currentVal < 88) {
          currentVal += 0.55;
          setProgressBar(currentVal);
        }
      }, 90);
    }

    function finishProgress(callback) {
      clearInterval(progressInterval);
      const finishTimer = setInterval(() => {
        if (currentVal < 100) {
          currentVal += 1.2;
          setProgressBar(Math.min(100, currentVal));
        } else {
          clearInterval(finishTimer);
          setTimeout(() => {
            progressBox.style.display = "none";
            if (callback) callback();
          }, 350);
        }
      }, 35);
    }

    function createTryonCard(frame, photoUrl, eyeData, isAvoid = false) {
      const lx = eyeData?.kiri?.[0] ?? 42;
      const ly = eyeData?.kiri?.[1] ?? 48;
      const rx = eyeData?.kanan?.[0] ?? 58;
      const ry = eyeData?.kanan?.[1] ?? 48;

      const eyeDistance = Math.hypot(rx - lx, ry - ly);
      const angle = Math.atan2(ry - ly, rx - lx) * (180 / Math.PI);
      const centerX = (lx + rx) / 2;
      const centerY = (ly + ry) / 2;

      const frameWidthPercent = Math.max(54, Math.min(eyeDistance * 2.85, 84));
      const frameHeightPercent = frameWidthPercent * 0.42;

      return `
        <div class="tryon-card ${isAvoid ? 'avoid' : ''}">
          <div class="tryon-image-wrap">
            <img src="${photoUrl}" class="face-shot" alt="Wajah">
            <div class="tryon-glasses-front" style="
              width: ${frameWidthPercent}%;
              height: ${frameHeightPercent}%;
              left: ${centerX}%;
              top: ${centerY}%;
              transform: translate(-50%, -50%) rotate(${angle}deg);
            ">
              ${renderFrontFrameOnly(frame.tipe, isAvoid)}
            </div>
          </div>
          <div class="tryon-details">
            <div class="tryon-name">${frame.nama}</div>
            <div class="tryon-desc">${frame.alasan}</div>
          </div>
        </div>
      `;
    }

    async function captureAndAnalyze() {
      let apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        apiKey = prompt("Masukkan API Key Gemini:");
        if (apiKey) {
          localStorage.setItem("gemini_api_key", apiKey.trim());
        } else {
          return;
        }
      }

      playCameraChime();

      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      capturedPhotoUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64Image = capturedPhotoUrl.split(',')[1];

      analyzeBtn.disabled = true;
      resultContainer.style.display = "none";
      startProgress();

      const promptText = `Periksa foto wajah ini dengan cermat:
1. DETEKSI KACAMATA: Cek apakah orang di foto sedang memakai kacamata (terlihat bingkai/frame terpasang di depan mata).
   - JIKA MEMAKAI KACAMATA: Set "sedang_memakai_kacamata": true, hitung "skor_cocok" (0-100), dan berikan ulasan kesesuaian di "deskripsi". Kosongkan "frame_cocok" dan "frame_hindari" ([]).
   - JIKA TIDAK MEMAKAI KACAMATA: Set "sedang_memakai_kacamata": false, "evaluasi_kacamata_sekarang": null, lalu isi "frame_cocok" dan "frame_hindari".
2. TITIK MATA: Koordinat titik pupil kedua mata [X, Y] (0-100%).
3. BENTUK WAJAH & TONE KULIT: Klasifikasikan bentuk wajah serta tone kulit.
4. REKOMENDASI WARNA: Pilih warna frame yang cocok dengan tone kulit.

Keluarkan HANYA JSON valid persis seperti skema ini:
{
  "posisi_mata": {
    "kiri": [42.5, 48.0],
    "kanan": [58.5, 48.0]
  },
  "sedang_memakai_kacamata": true,
  "evaluasi_kacamata_sekarang": {
    "skor_cocok": 85,
    "deskripsi": "Model frame persegi panjang dengan sudut melunak ini sangat serasi dengan kontur wajah, menyeimbangkan garis rahang secara proporsional."
  },
  "bentuk_wajah": "Persegi",
  "tone_kulit": "Kuning Langsat",
  "frame_cocok": [
    {"nama": "Oval / Lonjong", "tipe": "oval", "alasan": "Melunakkan garis rahang yang tegas."}
  ],
  "warna_frame": [
    {"nama": "Gold / Emas Hangat", "hex": "#d4af37"},
    {"nama": "Tortoise / Havana", "hex": "#703816"},
    {"nama": "Cokelat Karamel", "hex": "#8c532b"},
    {"nama": "Clear / Transparan Hangat", "hex": "#e5e5dc"}
  ],
  "frame_hindari": [
    {"nama": "Kotak Penuh / Rectangular Tebal", "tipe": "square", "alasan": "Mempertegas sudut wajah sehingga tampak kaku."}
  ]
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          clearInterval(progressInterval);
          progressBox.style.display = "none";
          if (data.error.code === 429) {
            if (confirm("Batas kuota gratisan API Key tercapai sementara (tunggu 1 menit). Apakah ingin memasukkan API Key baru?")) {
              localStorage.removeItem("gemini_api_key");
            }
          } else {
            alert("Error: " + data.error.message);
          }
          return;
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const res = JSON.parse(rawText);

        finishProgress(() => {
          document.getElementById('resFaceShape').innerText = res.bentuk_wajah || "-";
          document.getElementById('resSkinTone').innerText = res.tone_kulit || "-";

          if (res.sedang_memakai_kacamata && res.evaluasi_kacamata_sekarang) {
            tryonSection.style.display = "none";
            avoidSection.style.display = "none";

            const evalData = res.evaluasi_kacamata_sekarang;
            currentGlassesContainer.innerHTML = `
              <div class="current-glasses-card">
                <div class="cg-top">
                  <span class="cg-status">Kacamata Saat Ini</span>
                  <span class="cg-score-pill">Kecocokan: ${evalData.skor_cocok || 0}%</span>
                </div>
                <div class="cg-content">
                  <img src="${capturedPhotoUrl}" class="cg-thumb" alt="Kacamata Terpakai">
                  <p class="cg-eval">${evalData.deskripsi || ""}</p>
                </div>
              </div>`;
            currentGlassesContainer.style.display = "block";
          } else {
            currentGlassesContainer.innerHTML = "";
            currentGlassesContainer.style.display = "none";

            let matchSliderHtml = "";
            (res.frame_cocok || []).forEach(f => {
              matchSliderHtml += createTryonCard(f, capturedPhotoUrl, res.posisi_mata, false);
            });
            document.getElementById('matchFramesSlider').innerHTML = matchSliderHtml;
            tryonSection.style.display = (res.frame_cocok && res.frame_cocok.length > 0) ? "block" : "none";

            let avoidSliderHtml = "";
            (res.frame_hindari || []).forEach(f => {
              avoidSliderHtml += createTryonCard(f, capturedPhotoUrl, res.posisi_mata, true);
            });
            document.getElementById('avoidFramesSlider').innerHTML = avoidSliderHtml;
            avoidSection.style.display = (res.frame_hindari && res.frame_hindari.length > 0) ? "block" : "none";
          }

          let colorsHtml = "";
          (res.warna_frame || []).forEach(c => {
            colorsHtml += `
              <div class="color-chip">
                <span class="color-dot" style="background: ${c.hex || '#d4af37'};"></span>
                <span>${c.nama}</span>
              </div>`;
          });
          document.getElementById('colorsList').innerHTML = colorsHtml;

          resultContainer.style.display = "block";
        });
      } catch (err) {
        clearInterval(progressInterval);
        progressBox.style.display = "none";
        console.error(err);
        alert(err.message || String(err));
      } finally {
        analyzeBtn.disabled = false;
      }
    }
  </script>
</body>
