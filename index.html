<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VRANDOLV</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; margin: 0; padding: 12px; color: #f8fafc; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 20px; padding: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    
    .brand-header { display: flex; align-items: center; justify-content: center; width: 100%; margin: 4px 0 14px; }
    .brand-logo { height: 32px; width: auto; object-fit: contain; margin-right: -6px; display: block; }
    .brand-title { margin: 0; color: #ffffff; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; line-height: 1; display: block; }
    
    .mirror-box { width: 100%; height: 52vh; min-height: 360px; border-radius: 16px; overflow: hidden; background: #000; border: 2px solid #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.25); position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { display: none; }

    /* PANDUAN WAJAH & KACAMATA PUTIH */
    .face-guide-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .guide-svg-wrap { width: 90%; height: 86%; position: relative; }
    .guide-svg-wrap svg { width: 100%; height: 100%; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
    
    /* Garis Wajah Default (Putih) */
    .guide-svg-wrap svg path.face-line { stroke: rgba(255, 255, 255, 0.85); transition: stroke 0.3s ease; }
    
    /* PANDUAN KACAMATA (DIBUAT PUTIH TERANG & LEBIH BESAR) */
    .guide-glasses-wrap { 
      position: absolute; 
      top: 43%; 
      left: 49%; 
      transform: translate(-50%, -50%); 
      width: 75%; /* Diperbesar dari 62% agar menjangkau tepi wajah */
      pointer-events: none; 
    }
    .guide-glasses-wrap img {
      width: 100%;
      height: auto;
      opacity: 0.8;
      filter: invert(1) brightness(1.5) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      transition: all 0.3s ease;
    }
    
    .guide-tip { position: absolute; bottom: 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.5); padding: 5px 14px; border-radius: 20px; font-size: 11px; color: #ffffff; text-align: center; transition: all 0.3s ease; }
    
    /* Efek Saat Memindai (Scanning - Kacamata Menyala Hijau) */
    .scanning .guide-svg-wrap svg path.face-line { stroke: rgba(34, 197, 94, 0.9); }
    .scanning .guide-glasses-wrap img { 
      opacity: 1;
      filter: invert(1) brightness(1.5) drop-shadow(0 0 15px rgba(34, 197, 94, 1)); 
    }
    .scanning .guide-tip { background: rgba(34, 197, 94, 0.9); color: #000; font-weight: bold; border-color: #000; }
    
    .btn { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #f59e0b, #d4af37); color: #0b1120; border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; margin-top: 12px; transition: 0.2s; box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #475569; color: #94a3b8; box-shadow: none; }
    
    .progress-box { display: none; margin-top: 14px; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 14px; }
    .progress-labels { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #fbbf24; margin-bottom: 8px; }
    .progress-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-percent { font-weight: 700; min-width: 38px; text-align: right; }
    .progress-track { width: 100%; height: 8px; background: #1e293b; border-radius: 8px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #d4af37, #f59e0b); border-radius: 8px; transition: width 0.2s ease-out; }
    
    .result-container { margin-top: 16px; display: none; }
    
    .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .metric-badge { background: #0f172a; padding: 10px; border-radius: 12px; border: 1px solid #d4af37; text-align: center; }
    .metric-badge.full-span { grid-column: span 2; }
    .metric-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 3px; }
    .metric-value { font-size: 14px; font-weight: bold; color: #fbbf24; }

    .current-glasses-card { background: #0f172a; border-radius: 14px; padding: 14px; margin-bottom: 14px; border: 1px solid #d4af37; }
    .cg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cg-status { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .cg-score-pill { background: #d4af37; color: #0b1120; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; }
    .cg-content { display: flex; gap: 12px; align-items: flex-start; }
    .cg-thumb { width: 82px; height: 82px; border-radius: 10px; object-fit: cover; flex-shrink: 0; border: 1px solid #334155; }
    .cg-eval { font-size: 13px; color: #cbd5e1; line-height: 1.5; flex: 1; margin: 0; }
    
    .section-title { font-size: 13px; font-weight: bold; color: #cbd5e1; margin: 16px 0 10px; text-transform: uppercase; }
    
    .carousel-slider { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; }
    .carousel-slider::-webkit-scrollbar { height: 5px; }
    .carousel-slider::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    .tryon-card { flex: 0 0 250px; scroll-snap-align: start; background: #0f172a; border-radius: 14px; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; }
    .tryon-card.avoid { border-color: #ef4444; background: rgba(239, 68, 68, 0.08); }
    
    .tryon-image-wrap { width: 100%; height: 240px; position: relative; background: #000; overflow: hidden; }
    .tryon-image-wrap img.face-shot { width: 100%; height: 100%; object-fit: cover; }
    
    .tryon-glasses-front {
      position: absolute;
      transform-origin: center center;
      pointer-events: none;
      filter: drop-shadow(0 7px 12px rgba(0,0,0,0.85));
    }
    
    .tryon-details { padding: 10px 12px; flex: 1; }
    .tryon-name { font-size: 13px; font-weight: bold; color: #fbbf24; margin-bottom: 4px; }
    .tryon-card.avoid .tryon-name { color: #f87171; }
    .tryon-desc { font-size: 11px; color: #94a3b8; line-height: 1.4; }
    
    .colors-grid { display: flex; flex-wrap: wrap; gap: 8px; background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    .color-chip { display: flex; align-items: center; background: #1e293b; padding: 6px 10px; border-radius: 20px; font-size: 12px; border: 1px solid #475569; }
    .color-dot { width: 16px; height: 16px; border-radius: 50%; margin-right: 6px; border: 1px solid #64748b; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">VRANDOLV</span>
      </div>

      <div class="mirror-box">
        <video id="video" autoplay playsinline muted></video>
        <div id="faceGuide" class="face-guide-overlay">
          <div class="guide-svg-wrap">
            <svg viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path class="face-line" d="M 110,12 C 195,12 208,95 192,185 C 178,248 145,268 110,268 C 75,268 42,248 28,185 C 12,95 25,12 110,12 Z" 
                    stroke-width="2" stroke-dasharray="6 4" />
            </svg>
          </div>
          
          <div class="guide-glasses-wrap">
            <img src="Frame/frame kotak plastik.png" alt="Panduan" onerror="this.style.display='none'">
          </div>

          <div class="guide-tip">PENTING: Paskan bayangan kacamata putih di area mata & hidungmu!</div>
        </div>
      </div>
      <canvas id="canvas"></canvas>

      <button id="analyzeBtn" class="btn" onclick="captureAndAnalyze()">Mulai Analisis</button>
      
      <div id="progressBox" class="progress-box">
        <div class="progress-labels">
          <span id="progressText" class="progress-text">Memeriksa posisi wajah...</span>
          <span id="progressPercent" class="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      
      <div id="resultContainer" class="result-container">
        <div class="metrics-grid">
          <div class="metric-badge">
            <div class="metric-title">Bentuk Wajah</div>
            <div id="resFaceShape" class="metric-value">-</div>
          </div>
          <div class="metric-badge">
            <div class="metric-title">Tone Kulit</div>
            <div id="resSkinTone" class="metric-value">-</div>
          </div>
          <div class="metric-badge">
            <div class="metric-title">Lebar Frame Ideal</div>
            <div id="resFrameWidth" class="metric-value">-</div>
          </div>
          <div class="metric-badge">
            <div class="metric-title">Lebar Bridge Hidung</div>
            <div id="resBridgeWidth" class="metric-value">-</div>
          </div>
          <div class="metric-badge full-span">
            <div class="metric-title">Tipe Bantalan Hidung (Nosepad)</div>
            <div id="resNosepadType" class="metric-value">-</div>
          </div>
        </div>

        <div id="currentGlassesContainer"></div>

        <div id="tryonSection" style="display: none;">
          <div class="section-title">✨ Rekomendasi Frame</div>
          <div id="matchFramesSlider" class="carousel-slider"></div>
        </div>

        <div class="section-title">🎨 Rekomendasi Warna Frame</div>
        <div id="colorsList" class="colors-grid"></div>

        <div id="avoidSection" style="display: none;">
          <div class="section-title" style="color: #f87171;">🚫 Frame Dihindari</div>
          <div id="avoidFramesSlider" class="carousel-slider"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const resultContainer = document.getElementById('resultContainer');
    const tryonSection = document.getElementById('tryonSection');
    const avoidSection = document.getElementById('avoidSection');
    const currentGlassesContainer = document.getElementById('currentGlassesContainer');

    let progressInterval = null;
    let currentVal = 0;
    let capturedPhotoUrl = "";

    function playCameraChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    window.onload = function() {
      startLiveMirror();
    };

    async function startLiveMirror() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert(err.name + ": " + err.message);
      }
    }

    function getFrameImageSrc(type) {
      const t = (type || "").toLowerCase();
      if (t === "oversized") return "Frame/frame oversized plastik.png";
      if (t === "browline" || t === "brownline") return "Frame/frame brownline plastik.png"; 
      if (t === "geometric") return "Frame/frame geometric plastik.png";
      if (t === "wayfarer") return "Frame/frame wayfarer plastik.png";
      if (t === "cateye") return "Frame/frame cateye plastik.png";
      if (t === "kotak") return "Frame/frame kotak plastik.png";
      if (t === "lonjong") return "Frame/frame lonjong plastik.png";
      if (t === "persegi panjang") return "Frame/frame persegi panjang plastik.png";
      if (t === "bulat") return "Frame/frame bulat plastik.png";
      return "Frame/frame kotak plastik.png";
    }

    function setProgressBar(percent) {
      progressBar.style.width = percent + "%";
      progressPercent.innerText = Math.round(percent) + "%";
      if (percent < 20) progressText.innerText = "Memeriksa pencahayaan & kontur wajah...";
      else if (percent < 50) progressText.innerText = "Menganalisis profil optik & skin tone...";
      else if (percent < 80) progressText.innerText = "Memilih model frame yang proporsional...";
      else progressText.innerText = "Menyelesaikan kurasi rekomendasi...";
    }

    function startProgress() {
      progressBox.style.display = "block";
      currentVal = 0;
      setProgressBar(0);
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (currentVal < 88) { currentVal += 0.55; setProgressBar(currentVal); }
      }, 90);
    }

    function finishProgress(callback) {
      clearInterval(progressInterval);
      const finishTimer = setInterval(() => {
        if (currentVal < 100) { currentVal += 1.2; setProgressBar(Math.min(100, currentVal)); } 
        else { clearInterval(finishTimer); setTimeout(() => { progressBox.style.display = "none"; if (callback) callback(); }, 350); }
      }, 35);
    }

    function createTryonCard(frame, photoUrl, isAvoid = false) {
      // Nilai Default
      let centerX = 49; 
      let centerY = 43; 
      let frameWidthPercent = 62; 
      
      const t = (frame.tipe || "").toLowerCase();
      
      // Penyesuaian ukuran dan posisi per tipe frame
      if (t === "persegi panjang") {
        centerY = 36; // Dinaikkan lagi ke arah mata (dari 39 ke 36)
        frameWidthPercent = 56; 
      } else if (t === "oversized") {
        frameWidthPercent = 75; // Diperbesar jauh lebih lebar untuk efek oversized
        centerY = 44; 
      }

      const imgSrc = getFrameImageSrc(frame.tipe);
      const imgStyle = isAvoid ? "filter: grayscale(0.5) opacity(0.8);" : "";

      return `
        <div class="tryon-card ${isAvoid ? 'avoid' : ''}">
          <div class="tryon-image-wrap">
            <img src="${photoUrl}" class="face-shot" alt="Wajah">
            <img src="${imgSrc}" class="tryon-glasses-front" alt="Kacamata" style="
              width: ${frameWidthPercent}%;
              height: auto;
              left: ${centerX}%;
              top: ${centerY}%;
              transform: translate(-50%, -50%);
              ${imgStyle}
            " onerror="this.onerror=null; this.src='Frame/frame kotak plastik.png';">
          </div>
          <div class="tryon-details">
            <div class="tryon-name">${frame.nama}</div>
            <div class="tryon-desc">${frame.alasan}</div>
          </div>
        </div>
      `;
    }

    async function captureAndAnalyze() {
      let apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        apiKey = prompt("Masukkan API Key Gemini:");
        if (apiKey) localStorage.setItem("gemini_api_key", apiKey.trim());
        else return;
      }

      const faceGuide = document.getElementById('faceGuide');
      const guideTip = document.querySelector('.guide-tip');
      faceGuide.classList.add('scanning');
      guideTip.innerText = "MENGUNCI POSISI WAJAH...";

      playCameraChime();

      const maxWidth = 480;
      const originalWidth = video.videoWidth || 720;
      const originalHeight = video.videoHeight || 960;
      const scale = maxWidth / originalWidth;

      canvas.width = maxWidth;
      canvas.height = originalHeight * scale;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      capturedPhotoUrl = canvas.toDataURL('image/jpeg', 0.75);
      const base64Image = capturedPhotoUrl.split(',')[1];

      analyzeBtn.disabled = true;
      resultContainer.style.display = "none";
      startProgress();

      const promptText = `Periksa foto wajah ini untuk kebutuhan rekomendasi optik:
1. DETEKSI KACAMATA:
   - JIKA MEMAKAI: Set "sedang_memakai_kacamata": true, hitung "skor_cocok" (0-100), dan isi "deskripsi". Kosongkan frame_cocok dan frame_hindari.
   - JIKA TIDAK: Set "sedang_memakai_kacamata": false, isi frame_cocok dan frame_hindari.
2. BENTUK WAJAH & TONE KULIT: Klasifikasikan secara objektif (misal: Oval, Persegi, dll).
3. PARAMETER SPESIFIKASI:
   - "lebar_frame_ideal": (Pilih: "S (< 130 mm)", "M (130 - 139 mm)", atau "L (140 - 146 mm)").
   - "lebar_bridge_hidung": (Pilih: "15 - 17 mm (Sempit)", "18 - 20 mm (Sedang)", atau "21 - 23 mm (Lebar)").
   - "tipe_nosepad": (Pilih: "Nosepad Fleksibel" atau "Fixed Bridge").
4. PILIHAN FRAME BINGKAI (SANGAT PENTING):
   - Aturan penamaan: Kamu HARUS menggunakan format "Frame [Nama Tipe]".
   - Contoh wajib: "Frame Oversized", "Frame Browline", "Frame Geometric", "Frame Wayfarer", "Frame Cateye", "Frame Kotak", "Frame Lonjong", "Frame Persegi Panjang", "Frame Bulat".
   - DILARANG menambahkan kata sifat seperti "klasik", "sempit", atau "elegan" pada nama frame!

Keluarkan HANYA JSON valid:
{
  "sedang_memakai_kacamata": false,
  "evaluasi_kacamata_sekarang": null,
  "bentuk_wajah": "[Nama Bentuk]",
  "tone_kulit": "[Nama Tone]",
  "lebar_frame_ideal": "[Pilih S/M/L]",
  "lebar_bridge_hidung": "[Pilih Lebar Bridge]",
  "tipe_nosepad": "[Pilih Tipe Nosepad]",
  "frame_cocok": [
    {"nama": "Frame [Tipe Baku]", "tipe": "[Pilih Tipe Valid]", "alasan": "[Alasan spesifik]"}
  ],
  "warna_frame": [
    {"nama": "[Rekomendasi Warna]", "hex": "[#KodeHex]"}
  ],
  "frame_hindari": [
    {"nama": "Frame [Tipe Baku]", "tipe": "[Pilih Tipe Valid]", "alasan": "[Alasan spesifik]"}
  ]
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [ { text: promptText }, { inlineData: { mimeType: "image/jpeg", data: base64Image } } ] }],
            generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
          })
        });

        const data = await response.json();

        if (data.error) {
          clearInterval(progressInterval);
          progressBox.style.display = "none";
          if (data.error.code === 429) {
            if (confirm("Batas API Key tercapai. Masukkan API Key baru?")) {
              localStorage.removeItem("gemini_api_key");
            }
          } else {
            alert("Error: " + data.error.message);
          }
          return;
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const res = JSON.parse(rawText);

        finishProgress(() => {
          document.getElementById('resFaceShape').innerText = res.bentuk_wajah || "-";
          document.getElementById('resSkinTone').innerText = res.tone_kulit || "-";
          document.getElementById('resFrameWidth').innerText = res.lebar_frame_ideal || "-";
          document.getElementById('resBridgeWidth').innerText = res.lebar_bridge_hidung || "-";
          document.getElementById('resNosepadType').innerText = res.tipe_nosepad || "-";

          if (res.sedang_memakai_kacamata && res.evaluasi_kacamata_sekarang) {
            tryonSection.style.display = "none";
            avoidSection.style.display = "none";
            const evalData = res.evaluasi_kacamata_sekarang;
            currentGlassesContainer.innerHTML = `
              <div class="current-glasses-card">
                <div class="cg-top">
                  <span class="cg-status">Kacamata Saat Ini</span>
                  <span class="cg-score-pill">Kecocokan: ${evalData.skor_cocok || 0}%</span>
                </div>
                <div class="cg-content">
                  <img src="${capturedPhotoUrl}" class="cg-thumb" alt="Kacamata Terpakai">
                  <p class="cg-eval">${evalData.deskripsi || ""}</p>
                </div>
              </div>`;
            currentGlassesContainer.style.display = "block";
          } else {
            currentGlassesContainer.innerHTML = "";
            currentGlassesContainer.style.display = "none";

            let matchSliderHtml = "";
            (res.frame_cocok || []).forEach(f => {
              matchSliderHtml += createTryonCard(f, capturedPhotoUrl, false);
            });
            document.getElementById('matchFramesSlider').innerHTML = matchSliderHtml;
            tryonSection.style.display = (res.frame_cocok && res.frame_cocok.length > 0) ? "block" : "none";

            let avoidSliderHtml = "";
            (res.frame_hindari || []).forEach(f => {
              avoidSliderHtml += createTryonCard(f, capturedPhotoUrl, true);
            });
            document.getElementById('avoidFramesSlider').innerHTML = avoidSliderHtml;
            avoidSection.style.display = (res.frame_hindari && res.frame_hindari.length > 0) ? "block" : "none";
          }

          let colorsHtml = "";
          (res.warna_frame || []).forEach(c => {
            colorsHtml += `
              <div class="color-chip">
                <span class="color-dot" style="background: ${c.hex || '#d4af37'};"></span>
                <span>${c.nama}</span>
              </div>`;
          });
          document.getElementById('colorsList').innerHTML = colorsHtml;

          resultContainer.style.display = "block";
        });
      } catch (err) {
        clearInterval(progressInterval);
        progressBox.style.display = "none";
        console.error(err);
        alert(err.message || String(err));
      } finally {
        analyzeBtn.disabled = false;
        faceGuide.classList.remove('scanning');
        guideTip.innerText = "PENTING: Paskan bayangan kacamata putih di area mata & hidungmu!";
      }
    }
  </script>
</body>
</html>
